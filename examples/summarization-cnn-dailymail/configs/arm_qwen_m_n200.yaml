# qwen_m on the 200-article slice. Generated from arm_qwen_m.yaml; ONLY config_id and
# dataset_id differ, so a delta against the n=20 run is attributable to n and nothing else.
#
# WHY THIS ARM: CONTROL, not a contender: last on coverage at n=20 and the ONLY pair that separated (deepseek_s > qwen_m, p=0.0004). If n=200 cannot reproduce that, the run is broken, not the models.
#
# WHY THESE 8 AND NOT 24: the union of the two defensible top-5 readings of the n=20
# report — by `coverage` (the declared PRIMARY_METRIC, report §3) and by mean rank
# across coverage/concision/rougeLsum/rouge1 (journal entry 41) — plus one control.
# Picking either list alone would have been a coin toss between two orderings the data
# does not distinguish.
#
# THE SELECTION EFFECT, STATED BEFORE THE RESULT: these arms were chosen BECAUSE they
# ranked high at n=20, so their measured leads are winner's-curse inflated —
# leave-one-article-out moved the top delta between 0.005 and 0.019 (journal entry 10).
# And fetch.py pages from offset 0 of the same split, so the original 20 items are NESTED
# inside these 200. Only the 180 new articles are out-of-sample; a replication claim must
# be read on those, not on all 200.
#
# WHAT n=200 CAN BUY (journal entry 40): minimum detectable delta falls 0.0446 -> 0.0141.
# That reaches the price question (0.0308) and best-vs-5th (0.0193). It does NOT reach
# deepseek_m vs deepseek_s (0.0048, n~2472). Expect a separated top GROUP, not a winner.
#
# r=1, not r=3: with articles available, repeats are the wrong place to spend the same
# budget — n=60/r=1 gave sd(delta) 0.0090 against n=20/r=3 at 0.0133 (journal entry 10).
config_id: cnn_qwen_m_n200_v1
dataset_id: cnn_dailymail_200
adapter: ../adapter.py
params:
  provider: litellm
  model: eval-qwen-37plus
  family: qwen
  price_tier: mid
  temperature: 0.0
  prompt_file: prompt.txt
  reasoning:
    enabled: false
  max_tokens: 1200
  usd_per_mtok_in: 0.2
  usd_per_mtok_out: 0.8
