# qwen / large
#
# WHY price_tier AND NOT "size": this field is the vendor's own small/mid/large product
# step, which is a PRICE ladder. It was called `tier` and read as model size, and that was
# wrong in every family: the three arms differ in generation as well as price --
#   anthropic  haiku-4.5 / sonnet-5 / opus-5        openai   gpt-5.4-mini / 5.5 / 6-sol
#   qwen       3.8-flash / 3.7-plus / 3-max         glm      4.5-air / 4.6 / 5
#   mistral    small-3.2 / medium-3.1 / large-2512  llama    4-scout / 3.3-70b / 4-maverick
#   gemma      3-27b / 4-26b-a4b / 4-31b            deepseek v4-flash / v4.1-flash / v4-pro
# qwen's "large" is the OLDEST generation of the three. So this experiment cannot
# attribute a difference between tiers to size, and no conclusion here should try.
#
# Every arm shares the dataset, the adapter, the prompt file and reasoning-off. Only the
# model varies — which the run fingerprint records, so "we varied one thing" is checkable.
config_id: cnn_qwen_l_v1
dataset_id: cnn_dailymail_20
adapter: ../adapter.py
params:
  provider: litellm
  model: eval-qwen-3max
  family: qwen
  price_tier: large
  temperature: 0.0
  prompt_file: prompt.txt
  reasoning:
    enabled: false
  max_tokens: 1200
  usd_per_mtok_in: 0.4
  usd_per_mtok_out: 1.6
