# openai_m on the 200-article slice. Generated from arm_openai_m.yaml; ONLY config_id and
# dataset_id differ, so a delta against the n=20 run is attributable to n and nothing else.
#
# WHY THIS ARM: it completes the field. The first eight n200 arms were CHOSEN from the
# n=20 table, and being chosen by a result is a selection effect — the Spearman between
# the n=20 and n=200 orderings of those eight was +0.667, which is what that selection was
# worth. With all 24 run, no arm is present because an earlier result put it there, and
# the 24-arm table carries no selection caveat at all.
#
# WHY IT IS WORTH THE CALLS: the Nemenyi critical difference is q(k)*sqrt(k(k+1)/6N). At
# k=24, N=20 that is 8.13 rank positions against an observed span of 8.57 — the threshold
# was wider than the whole table, which is why exactly 1 of 276 pairs separated. At
# k=24, N=200 it is 2.57. Same test, same arms, a third of the threshold.
#
# r=1, not r=3: with articles available, repeats are the wrong place to spend the same
# budget — n=60/r=1 gave sd(delta) 0.0090 against n=20/r=3 at 0.0133 (journal entry 10).
# So this run measures no within-arm variance; the r=3 sweep on the 20-item slice is where
# that lives, and it is not re-measured here.
config_id: cnn_openai_m_n200_v1
dataset_id: cnn_dailymail_200
adapter: ../adapter.py
params:
  provider: litellm
  model: eval-gpt-55
  family: openai
  price_tier: mid
  temperature: 0.0
  prompt_file: prompt.txt
  reasoning:
    enabled: false
  max_tokens: 1200
  usd_per_mtok_in: 1.25
  usd_per_mtok_out: 10.0
