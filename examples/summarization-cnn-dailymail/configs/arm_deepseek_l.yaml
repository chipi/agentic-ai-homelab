# deepseek / large
#
# Every arm shares the dataset, the adapter, the prompt file and reasoning-off. Only the
# model varies — which the run fingerprint records, so "we varied one thing" is checkable.
config_id: cnn_deepseek_l_v1
dataset_id: cnn_dailymail_20
adapter: ../adapter.py
params:
  provider: litellm
  model: eval-deepseek-pro
  family: deepseek
  tier: large
  temperature: 0.0
  prompt_file: prompt.txt
  reasoning:
    enabled: false
  max_tokens: 1200
  usd_per_mtok_in: 0.28
  usd_per_mtok_out: 1.1
