# openai / large-tier. One model, one file.
#
# Tiers exist so the leaderboard can be read two ways: DOWN a vendor (does paying more
# inside a family buy anything?) and ACROSS a tier (which vendor's small model wins?).
# Every arm shares dataset_id, adapter and prompt — vary one thing or it is not a
# comparison, and the run fingerprint records the rest so that is checkable.
config_id: cnn_openai_gpt_v1
dataset_id: cnn_dailymail_20
adapter: ../adapter.py
params:
  provider: litellm
  model: eval-gpt
  family: openai
  tier: large
  temperature: 0.0
  # 1200, not 200. Reasoning models emit their thinking INSIDE this budget: at 200 a
  # reasoning arm spent ~194 tokens reasoning, had ~6 left for the summary, and scored half
  # of everyone else — which read as a model finding and was a ceiling artifact. The budget
  # has to clear the reasoning, or the eval measures the cap.
  #
  # The reasoning tokens are still PAID FOR, and that is the honest result: on this task
  # those models genuinely cost several times more per summary. Cost is a reported axis, so
  # it shows up there rather than being hidden as a quality penalty.
  max_tokens: 1200
  prompt: "Summarise this news article in 2-3 short sentences, in the terse style of a news wire summary. Output only the summary."
  usd_per_mtok_in: 1.25
  usd_per_mtok_out: 10.0
