# A live arm through the LiteLLM proxy. `model` is the PROXY's model_name —
# the mapping to an upstream provider is the proxy's business, which is the
# whole reason for putting it there.
config_id: live_smoke_v1
dataset_id: smoke_v1
params:
  provider: litellm
  model: homelab-flash
  temperature: 0.0
  max_tokens: 200
  prompt: "Summarise the following in one sentence:"
  usd_per_mtok_in: 0.27
  usd_per_mtok_out: 1.10
