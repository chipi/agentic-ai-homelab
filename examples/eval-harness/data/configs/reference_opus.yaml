# The arm whose output becomes the SILVER reference for smoke_v1.
#
# Silver, not gold: gold is human-authored ground truth, silver is
# model-generated. A run scored against this can rank arms against each other;
# it cannot claim any of them is correct. Every run records which tier it used,
# so that distinction survives into the numbers.
#
# Opus deliberately. The reference is the thing every later arm is measured
# against, so it is the one place where paying for the strongest available model
# is the cheap option — a weak reference silently caps every score that cites it.
config_id: reference_opus_v1
dataset_id: smoke_v1
params:
  provider: litellm
  # The PROXY's model_name. Mapping to openrouter/anthropic/... is the proxy's
  # business, and the key it sits behind is scoped to the podcast vertical's
  # budget, so this cannot drain another workload's spend.
  model: eval-claude-opus
  temperature: 0.0
  max_tokens: 400
  prompt: "Summarise the following in one sentence:"
  # Prices live in the config, not in code, so a run records the price it was
  # costed at. A number computed from today's list is not comparable to one from
  # last quarter's without saying so.
  usd_per_mtok_in: 5.00
  usd_per_mtok_out: 25.00
