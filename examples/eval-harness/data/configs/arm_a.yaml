# A sweep arm. Same dataset_id as its peers, or the leaderboard refuses.
#
# `sentences` is the only knob the echo provider reads. This used to also carry
# max_tokens and usd_per_mtok_in/out, which echo never looks at — it makes no API call,
# so it has no tokens and costs nothing. Those keys made arm_a and arm_short look like
# different arms while producing byte-identical output, which is precisely what V5 flags.
# Keep a config's params to what its provider actually consumes.
config_id: arm_a_v1
dataset_id: smoke_v1
params:
  provider: echo
  sentences: 1
