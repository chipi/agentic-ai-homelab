# Merge-time gate for the homelab home page (infra/homelab-home).
#
# The page's JS and the status module are tested here (dependency-free node:
# test_page.js / test_uptime.js / test_hetzner_bar.js extract page functions from
# gen.sh with a stub DOM and fixture VM vectors; test_status.js tests
# hub-status.js's data). Anything that reaches origin/main has passed them on
# neutral infrastructure. The mini's deploy stays pull + gen.sh; since
# 2026-11-03 (operator decision, RFC-0008) the mini also runs node for the
# status and briefing jobs (status-job.js, briefing-job.js).

name: homelab-home

on:
  push:
    branches: [main]
    paths:
      - 'infra/homelab-home/**'
      - '.github/workflows/homelab-home.yml'
  pull_request:
    paths:
      - 'infra/homelab-home/**'
      - '.github/workflows/homelab-home.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: gen.sh syntax + page JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: gen.sh syntax
        run: bash -n infra/homelab-home/gen.sh

      - name: page JS tests
        run: |
          node infra/homelab-home/test_page.js
          node infra/homelab-home/test_uptime.js
          node infra/homelab-home/test_hetzner_bar.js

      - name: status module tests
        run: node infra/homelab-home/test_status.js
