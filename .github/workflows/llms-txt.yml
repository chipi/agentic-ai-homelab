# Fail when llms.txt (the agent-facing index of this repo's docs) is stale or a link in it does not resolve.
#
# llms.txt is generated by scripts/llms_txt.py from llms.config.json and from the docs themselves (their
# titles and first sentences), so any doc change can make it stale: no path filter. Agents read it first
# and open only what they need, so a stale or broken index sends them to the wrong doc.
# Fix a red run with:  make llms-txt   (python3 scripts/llms_txt.py --write)

name: llms-txt

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: llms.txt is up to date and every link resolves
        run: python3 scripts/llms_txt.py --check
