site_name: agentic-ai-homelab
site_description: How I work with agentic AI, end-to-end — cloud APIs, local infra, project scaffolding, agent harnesses.
site_url: https://chipi.github.io/agentic-ai-homelab/
site_author: Marko Dragoljevic

repo_name: chipi/agentic-ai-homelab
repo_url: https://github.com/chipi/agentic-ai-homelab
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# Scoped AGENTS.md files (agent working-rules) live inside docs/ but are
# not published — they'd otherwise surface as orphan pages on the site.
exclude_docs: |
  AGENTS.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra_javascript:
  - assets/js/external-links.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

