# Workstation-owned (agentic-ai-homelab: workstation/storage). Installed by
# `wb-storage install-dropins`; never edit Omarchy's no-block-boot.conf instead.
# Omarchy gives docker.service DefaultDependencies=no, which drops the implicit
# "after local filesystems" ordering. Without this, dockerd could start against
# the empty mountpoints inside @ before @docker / @containerd are mounted.
[Unit]
RequiresMountsFor=/var/lib/docker /var/lib/containerd
