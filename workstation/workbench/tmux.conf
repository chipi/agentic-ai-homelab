# workbench tmux — persistent per-project sessions, phone-friendly
set -g mouse on
set -g history-limit 50000
set -g default-terminal "screen-256color"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- status bar = the always-visible cheatsheet ---------------------------
set -g status on
set -g status-interval 5
set -g status-style bg=colour234,fg=colour248
set -g status-left "#[bg=colour24,fg=white,bold] WB #[default] "
set -g status-left-length 8
# window list = your project menu; current one highlighted
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=colour24,fg=white,bold] #I:#W "
# right side = the key chords you need on a phone (prefix is Ctrl-b)
set -g status-right "#[fg=colour110]C-b n:proj  c:new  ,:rename  w:menu  d:detach #[fg=colour246]| %H:%M"
set -g status-right-length 80

# quicker project creation: prefix + P makes a named window in ~/projects
bind P command-prompt -p "new project window name:" "new-window -c ~/projects -n %%"

# push tmux copy buffer to the CLIENT (laptop) clipboard over SSH via OSC 52
set -g set-clipboard on
# mouse drag-select copies and stays in copy-mode (no jump-to-bottom)
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-no-clear
