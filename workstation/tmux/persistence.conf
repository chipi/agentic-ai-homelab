# Workstation tmux persistence (agentic-ai-homelab: workstation/tmux/README.md).
# Sourced from the end of the user's tmux config by a marked block that
# workstation/install.sh adds; it does not replace the distribution's config.
#
# Workspace topology is durable, process execution is ephemeral:
# tmux-resurrect saves sessions, windows, panes, layouts and working
# directories; nothing is ever restarted in a restored pane.

# Snapshots: durable user state in $HOME (never /tmp or a project tree).
set -g @resurrect-dir '$HOME/.local/share/tmux/resurrect'

# Never restore programs: not agents, servers, test runners or editors. Restored
# panes are plain shells in their saved directories.
set -g @resurrect-processes 'false'

# Never save pane contents (scrollback can hold secrets).
set -g @resurrect-capture-pane-contents 'off'

# After each save: blank the saved command lines (arguments can hold secrets)
# and keep the snapshot readable by the user only.
set -g @resurrect-hook-post-save-layout '~/.local/bin/wb-tmux scrub'

run-shell '~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux'

# Periodic saves come from the wb-tmux-save.timer systemd user unit, not
# tmux-continuum (workstation/tmux/README.md, "Why not tmux-continuum").
