server {
  listen 80;
  root /usr/share/nginx/html;
  auth_basic "homelab";
  auth_basic_user_file /etc/nginx/.htpasswd;
  location /vm/ {
    proxy_pass http://victoriametrics:8428/;
  }
  # Same-origin Grafana proxy for the alert banner's alertmanager fetch. It
  # sends `Authorization: Bearer <viewer token>`, which a Basic-auth challenge
  # can't satisfy — so auth_basic MUST be off here or nginx 401s the request.
  # On WebKit/iOS that 401 drops the page's cached Basic credential and re-pops
  # the login dialog every refresh; Grafana enforces its own auth on the token.
  location /grafana/ {
    auth_basic off;
    proxy_pass http://grafana:3000/;
  }
}
