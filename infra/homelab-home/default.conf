server {
  listen 80;
  root /usr/share/nginx/html;
  # No basic auth since 2026-10-24 (operator): the page is reachable only over the
  # tailnet, from the operator's devices and the DGX/prod tags (tag:homelab-svc:443
  # grant in podcast_scraper tailscale/policy.hujson). It still lists the service
  # admin credentials; where those should live instead is an open decision.
  location /vm/ {
    proxy_pass http://victoriametrics:8428/;
  }
  # Same-origin Grafana proxy for the alert banner's alertmanager fetch, which
  # sends `Authorization: Bearer <viewer token>`; Grafana enforces that token.
  location /grafana/ {
    proxy_pass http://grafana:3000/;
  }
}
