# Langfuse v3 — self-hosted LLM/agent tracing (ADR-0005).
# Adapted from the upstream langfuse/langfuse docker-compose.yml:
#   - langfuse-web publishes to the TAILNET IP only (LANGFUSE_LISTEN:LANGFUSE_PORT,
#     default 127.0.0.1:4000 → container 3000; 4000 avoids Grafana's :3000).
#   - clickhouse / minio / redis / postgres / worker publish NO host ports —
#     internal compose bridge only (upstream bound some to 127.0.0.1:9000, which
#     collides with vLLM on this host). Reach them by service name.
#   - langfuse images pinned; datastores kept at upstream tags — PIN after first
#     good boot. Log rotation added (upstream has none).
# All secrets + NEXTAUTH_URL + LANGFUSE_INIT_* come from .env (gitignored).

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

services:
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3.221.1
    cpus: 0.5   # trace-ingest worker, barely-used homelab; cap it
    restart: always
    <<: *logging
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-worker-env
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/postgres}
      SALT: ${SALT:?set SALT in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: ${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}
      CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL:-clickhouse://clickhouse:9000}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_CLUSTER_ENABLED: ${CLICKHOUSE_CLUSTER_ENABLED:-false}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_EVENT_UPLOAD_REGION:-auto}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY:?set in .env}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT:-http://minio:9000}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE:-true}
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: ${LANGFUSE_S3_EVENT_UPLOAD_PREFIX:-events/}
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_MEDIA_UPLOAD_REGION:-auto}
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY:?set in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT:-http://minio:9000}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE:-true}
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: ${LANGFUSE_S3_MEDIA_UPLOAD_PREFIX:-media/}
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: ${LANGFUSE_S3_BATCH_EXPORT_ENABLED:-false}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_AUTH: ${REDIS_AUTH:?set REDIS_AUTH in .env}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
      # Langfuse puts a 30s socket watchdog on EVERY redis connection: "expecting data and
      # receives none for 30 seconds" -> destroy the socket. On idle BullMQ queues that is
      # permanent — every queue's blocking read trips it, so unrelated queues log the same
      # error within the same 93ms. 925-5,000 lines/day of it, and NOT one failing job.
      #
      # Upstream bug: langfuse#13601 (regression from v3.163.0, still present in our
      # 3.221.1). That report's alarming symptom is a connection LEAK (connected_clients
      # -> 87+). Measured here 2026-09-18 on LANGFUSE's redis (see the port warning below):
      #
      #     redis_connected_clients            96, FLAT across the observation window
      #     redis_connections_received_total   251,847 over ~8 days  (21.8/min)
      #     redis_rejected_connections_total   0
      #
      # The 251k is NOT the watchdog. It is this file's own redis healthcheck: `redis-cli
      # ping` every 3s opens and closes a fresh connection -> 20/min predicted vs 21.8/min
      # observed, the remainder being the exporter scrape. The rate was IDENTICAL before
      # and after this fix, which is the proof it was never watchdog churn.
      #
      # ⚠ PORT TRAP, and the reason an earlier version of this comment was wrong: host
      # :9121 is GLITCHTIP's redis exporter (5 clients, healthy); langfuse's is remapped to
      # :9122. BOTH report `9121/tcp` container-side. Quoting 5 clients / 7 connections
      # here was a reading of the wrong database.
      #
      # OPEN: whether 96 clients is a leak or just langfuse's normal pool (it opens a
      # dedicated blocking connection per BullMQ queue, and there are 15+). It was flat
      # over minutes, but a leak only shows as monotonic growth over HOURS and there is no
      # history — the series has only existed since we wired the scrape today. Watch
      # redis_connected_clients before concluding either way. Do NOT let this comment's
      # existence imply it was settled.
      #
      # 0 disables the watchdog (langfuse's documented value; a positive value must be
      # >=10000 because BullMQ blocking commands need headroom). The trade: it exists to
      # stop a genuinely hung connection holding a BullMQ concurrency slot forever. We have
      # no evidence of hung connections. If that changes, use 300000 — long enough that
      # idle queues never trip it, short enough to still reap a dead socket.
      REDIS_SOCKET_TIMEOUT_MS: ${REDIS_SOCKET_TIMEOUT_MS:-0}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      SMTP_CONNECTION_URL: ${SMTP_CONNECTION_URL:-}

  langfuse-web:
    image: docker.io/langfuse/langfuse:3.221.1
    restart: always
    <<: *logging
    depends_on: *langfuse-depends-on
    ports:
      - "${LANGFUSE_LISTEN:-127.0.0.1}:${LANGFUSE_PORT:-4000}:3000"
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      # Trust the incoming Host header so NextAuth login works over any reverse-
      # proxy origin (e.g. the tailscale-serve HTTPS endpoint on :8443) in
      # addition to the canonical NEXTAUTH_URL. Safe: the service is tailnet-only.
      AUTH_TRUST_HOST: "true"
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server
    cpus: 0.5   # idle ClickHouse scales background threads to cores; cap it (barely-used homelab, was ~204%).
                # config tune (clickhouse-lowcpu.xml, async metrics 1s->60s) didn't crack the idle spin —
                # it's thread-pool-driven and background_pool_size can't go low (mutation sanity check) — so
                # the cgroup cap is the reliable lever for this trivial trace volume.
    restart: always
    <<: *logging
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse-lowcpu.xml:/etc/clickhouse-server/config.d/zzz-lowcpu.xml:ro
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      # 5s -> 30s. ClickHouse is the heaviest idle process here (cpu-capped at 0.5 because
      # it spun ~204% doing nothing), so a probe that forks wget 12x/min is the one least
      # worth paying for. 138,655 -> 23,109 per 8 days. start_period covers the slow first
      # boot that the 1s interval was really compensating for.
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  minio:
    image: cgr.dev/chainguard/minio
    cpus: 0.5   # barely-used object store for langfuse; cap it (was ~40%)
    restart: always
    <<: *logging
    entrypoint: sh
    # create the 'langfuse' bucket before starting the service
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      # 1s was the worst in the stack: 60 probes/min = 693,278 per 8 days, each forking the
      # `mc` client, for an object store langfuse touches only on media/event upload.
      # 30s -> 23,109 per 8 days (-97%). start_period preserves fast first boot, which is
      # the only thing a 1s interval ever bought.
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_period: 1s

  redis:
    image: docker.io/redis:7
    restart: always
    <<: *logging
    command: >
      --requirepass ${REDIS_AUTH:?set REDIS_AUTH in .env}
      --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      # 3s (the upstream default) opened a fresh connection every 3 seconds forever:
      # 251,847 connections over 8 days of uptime, ~20/min, which is the ENTIRE value of
      # redis_connections_received_total on this box. Nothing needs to know within 3s that
      # a cache which has been healthy for 8 days is still healthy.
      #
      # 15s cuts that by 80% (~50k instead of ~250k over the same window). retries 5 keeps
      # unhealthy-detection at 75s, and start_period gives boot its grace without the
      # steady-state cost — `depends_on: condition: service_healthy` still gates correctly.
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: docker.io/postgres:${POSTGRES_VERSION:-17}
    restart: always
    <<: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      # 3s -> 15s, matching redis: pg_isready opens a real connection per probe, so this was
      # another ~231,092 connections per 8 days against a database langfuse barely writes to.
      # 15s -> ~46,218 (-80%), unhealthy still inside 75s.
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

  # ---- DB/cache metrics (scraped by the DGX Alloy collector on localhost) ----
  # Published on 127.0.0.1 only (host-net Alloy reaches via localhost; never
  # tailnet-exposed). Host ports 9188/9122 to avoid glitchtip's 9187/9121.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    <<: *logging
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:9188:9187"
    restart: always

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    <<: *logging
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_AUTH:?set REDIS_AUTH in .env}
    depends_on:
      redis: { condition: service_started }
    ports:
      - "127.0.0.1:9122:9121"
    restart: always

volumes:
  langfuse_postgres_data:
    driver: local
  langfuse_clickhouse_data:
    driver: local
  langfuse_clickhouse_logs:
    driver: local
  langfuse_minio_data:
    driver: local
  langfuse_redis_data:
    driver: local
