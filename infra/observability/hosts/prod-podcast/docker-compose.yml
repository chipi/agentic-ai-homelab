# VPS (prod-podcast) observability collector — Alloy + cAdvisor only.
# Adapted from agentic-ai-homelab/infra/observability/docker-compose.yml for a
# NO-GPU box: dcgm-exporter + ollama-metrics dropped (nothing to scrape).
# cAdvisor is moved off :8080 (the viewer owns it) to :8081.
# Pushes metrics -> VictoriaMetrics and logs -> VictoriaLogs on the Mac mini
# (`homelab`), over the tailnet.

services:
  alloy:
    image: grafana/alloy:v1.17.0
    container_name: alloy
    network_mode: host
    pid: host
    volumes:
      - ./config.d:/etc/alloy/config.d:ro                # base.alloy + per-app <app>.alloy drop-ins (ADR-121)
      - /:/rootfs:ro,rslave                              # host metrics + journal + caddy log
      - /var/run/docker.sock:/var/run/docker.sock:ro     # discovery.docker -> api /metrics scrape
    env_file:
      - .env
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.d
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    restart: unless-stopped

  cadvisor:
    # v0.60.5 — NOTE: prod's root cause is DIFFERENT from the DGX's, despite the
    # identical symptom (container series with `id=` but no `name`/`image`/labels).
    #
    #   DGX  : Docker 29.2.1, MinAPIVersion 1.44, storage driver overlay2.
    #          v0.49.1's API client (1.41) < 1.44 -> docker factory never registers.
    #          Fixed by any newer client; v0.52.1 was enough there.
    #   prod : Docker MinAPIVersion 1.40 (so v0.49.1's client is FINE), storage
    #          driver **overlayfs** = Docker's containerd snapshotters are enabled.
    #          Images then live in /var/lib/containerd/io.containerd.snapshotter.v1.*
    #          NOT /var/lib/docker/image/<driver>/layerdb, so cadvisor's lookup of
    #          /rootfs/var/lib/docker/image/overlayfs/layerdb/mounts/<id>/mount-id
    #          fails -> "failed to identify the read-write layer ID" every 60s ->
    #          createContainer fails -> the container is never registered.
    #          Upstream: google/cadvisor#3643, fixed by PR #3709 (merged 2025-12-02).
    #
    # **v0.52.1 does NOT contain that fix** — verified via the GitHub compare API:
    # 7eda190...v0.52.1 = "behind", ...v0.54.0 = "ahead". So v0.52.1 (the DGX's fix)
    # would have been a no-op here, which is what the podcast agent's precheck caught.
    #
    # PIN v0.55.1 — and DO NOT raise it from GitHub releases. GitHub lists up to
    # v0.60.5, but those images are NOT published to gcr.io: the registry's tag list
    # ends at v0.50.0, v0.51.0, v0.52.0, v0.52.1, v0.54.1, v0.55.1 (verified against
    # gcr.io/v2/cadvisor/cadvisor/tags/list on 2026-08-31). A v0.60.5 pin fails the
    # image pull and leaves prod with NO container metrics at all — worse than the
    # bug it was meant to fix. A GitHub release is not a published image tag; check
    # the registry, not the releases page.
    # v0.55.1 is DEPLOYED AND PROVEN on prod: named container series 0 -> 15
    # (= all 15 running containers), 0 layerdb errors.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    network_mode: host
    privileged: true
    cgroup: host               # cgroup v2: see the host's docker-*.scope cgroups (per-container metrics)
    command:
      - "--port=8081"          # VPS: :8080 is the viewer; scrape target is localhost:8081
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    restart: unless-stopped
