# homelab (Mac mini) self-monitoring collector — Alloy in a container on colima.
# Bridge-networked (NOT host mode — macOS has no host networking). Reaches the
# native node_exporter + the local backend stores via host.docker.internal.
# Ships every container's logs to the local VictoriaLogs.
#
# Prereq: node_exporter running natively (brew) on :9100 — see README.
# Deploy:  cd infra/observability/hosts/homelab && docker compose up -d

services:
  alloy:
    image: grafana/alloy:v1.17.0
    container_name: alloy-homelab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      # default (homelab_default) for isolation; litellm_default + delivery_default so
      # alloy scrapes those exporters by container name over the docker network, not via
      # the host's fragile lima port-forward. See config.alloy + the recovery recipe.
      - default
      - litellm
      - delivery
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro    # container-log discovery
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    restart: unless-stopped

networks:
  # external networks owned by the litellm + delivery stacks — alloy joins them to
  # scrape their exporters VM-internally by container name (resilient to lima forward
  # breaks). If either stack is renamed/removed, update the target name here.
  litellm:
    external: true
    name: litellm_default
  delivery:
    external: true
    name: delivery_default
