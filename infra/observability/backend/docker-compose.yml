# Self-hosted observability BACKEND — VictoriaMetrics (storage) + Grafana (viz).
#
# Runs on the ONE host that stores + views metrics: the Mac mini (`homelab`).
# Collectors (the Alloy compose in ../) run on the hosts — the mini itself, the
# VPS, and the DGX's exporters (pulled by the mini's dgx-scrape over the LAN) —
# and remote_write here over Tailscale.
#
# Topology:
#   dgx-scrape (pulls DGX) ─┐
#   Alloy@VPS              ─┼─►  VictoriaMetrics :8428  ◄──  Grafana :3000
#   Alloy@mini            ─┘         (this compose, on the mini)
#
# Ingest + Grafana are published to the TAILSCALE IP only (set VM_LISTEN /
# GRAFANA_LISTEN in .env) — never to a public interface. Grafana reaches VM
# over the internal compose bridge (http://victoriametrics:8428), so the
# published port is ingest/query for remote collectors + your browser only.
#
# Re-home to another host (the DGX→mini move is already done):
#   1. `docker compose down`  (on the current host)
#   2. carry the `vm-data` + `grafana-data` volumes, OR start fresh (short
#      retention makes a clean start cheap)
#   3. `docker compose up -d`  (on the mini)
#   4. give the mini the same Tailscale name/IP → collectors don't notice.
#
# v0.1: images pinned. Bump deliberately (dependency = design change).

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.1
    container_name: victoriametrics
    command:
      - --httpListenAddr=:8428
      - --retentionPeriod=${VM_RETENTION:-6}          # months
      - --storageDataPath=/victoria-metrics-data
      - --dedup.minScrapeInterval=15s
    ports:
      # Publish ingest + query to the TAILNET IP only. Set VM_LISTEN=100.x.y.z
      # in .env. Defaults to 127.0.0.1 (local-only) until you wire Tailscale.
      - "${VM_LISTEN:-127.0.0.1}:8428:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: victorialogs
    # A ceiling, not a reservation: idle CPU stays with the rest of the box. Raised from
    # 1.0 (set after a burst hit ~95% of the 8-core VM) because 1 CPU runs only 2 searches
    # at a time and a log dashboard opens 6-10, so panels queued behind each other.
    cpus: 2.0
    command:
      - --httpListenAddr=:9428
      - --retentionPeriod=${VLOGS_RETENTION:-30d}
      - --storageDataPath=/victoria-logs-data
      # Searches run a few at a time (2 per CPU); a dashboard opening fires ~6-10 at once. The
      # default 10s queue wait answered the rest with 503 ("No data" panels). Wait up to
      # Grafana's own 30s datasource timeout instead.
      - --search.maxQueueDuration=30s
    ports:
      # Ingest + query to the TAILNET IP only (set VLOGS_LISTEN=100.x.y.z).
      # Defaults to 127.0.0.1 (local-only) until you wire Tailscale.
      - "${VLOGS_LISTEN:-127.0.0.1}:9428:9428"
    volumes:
      - vlogs-data:/victoria-logs-data
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    restart: unless-stopped

  victoriatraces:
    image: victoriametrics/victoria-traces:v0.9.4
    container_name: victoriatraces
    command:
      - --httpListenAddr=:10428
      - --storageDataPath=/vtraces
    ports:
      # OTLP ingest + query to the TAILNET IP only (set VTRACES_LISTEN=100.x.y.z).
      # Defaults to 127.0.0.1 (local-only) until you wire Tailscale.
      - "${VTRACES_LISTEN:-127.0.0.1}:10428:10428"
    volumes:
      - vt-data:/vtraces
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    restart: unless-stopped

  grafana:
    # grafana/grafana, not grafana-oss: the -oss repo stopped at 11.6.5. 11.6.11+ is the
    # floor for grafana-exploretraces-app (Traces Drilldown).
    image: grafana/grafana:11.6.16
    container_name: grafana
    depends_on: [victoriametrics, victorialogs, victoriatraces]
    ports:
      # Publish the UI to the TAILNET IP so you can reach it from your laptop
      # over the tailnet. Set GRAFANA_LISTEN=100.x.y.z in .env.
      - "${GRAFANA_LISTEN:-127.0.0.1}:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Pinned: unpinned installs take the newest release on every recreate, and
      # exploretraces 3.0.0 needs Grafana >= 13.1. 2.2.1 supports 11.6.11-11.x.
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource 0.32.0,grafana-exploretraces-app 2.2.1
      # Grafana preinstalls Logs Drilldown (grafana-lokiexplore-app), which only works on
      # Loki datasources — we have none — and failed to load on every page.
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Serve behind an HTTPS reverse proxy on a subpath (tailscale serve
      # --set-path=/grafana, which STRIPS the prefix). Set GRAFANA_ROOT_URL in
      # .env to the external URL (e.g. https://homelab.<tailnet>/grafana) so
      # Grafana emits /grafana-prefixed asset + redirect links. Leave serve-from-
      # sub-path false: the proxy strips the prefix, so Grafana still serves at
      # root. Empty default = direct :3000 access, unchanged.
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-}
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      # read-only LiteLLM spend datasource (provisioning/datasources/litellm-postgres.yml)
      - LITELLM_PG_RO_PASSWORD=${LITELLM_PG_RO_PASSWORD:-}
      # --- Alerting notification channels (generic / add-later) -----------------
      # The alert rules + routing are provisioned as code; the CHANNELS are
      # pluggable — each activates the moment you set its env in .env and restart
      # grafana. Empty = channel defined but silent (alerts still fire in the UI).
      # provisioning/alerting/contactpoints.yaml reads these via $__env{...}. The
      # defaults are INERT placeholders (Grafana rejects empty channel settings) —
      # a channel is defined + valid but sends nowhere until you override the var in
      # .env with a real value + restart. SMTP stays disabled, so nothing delivers.
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-alerts@example.com}
      - ALERT_SLACK_WEBHOOK_URL=${ALERT_SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/PLACEHOLDER-SET-IN-ENV}
      - ALERT_GLITCHTIP_WEBHOOK_URL=${ALERT_GLITCHTIP_WEBHOOK_URL:-https://glitchtip.example.com/PLACEHOLDER-SET-IN-ENV}
      # Email transport (only needed if you wire the email channel). Disabled by default.
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${GF_SMTP_HOST:-}
      - GF_SMTP_USER=${GF_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:-admin@grafana.localhost}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    restart: unless-stopped

volumes:
  vm-data:
  vlogs-data:
  vt-data:
  grafana-data:
