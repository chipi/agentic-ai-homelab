# File-provider — dashboards are provisioned from ./grafana/dashboards, with the
# FOLDER taken from each subdirectory name (foldersFromFilesStructure: true + empty
# `folder`). Each subdir is a Grafana folder, persisting the 2026-07-23 reorg as code:
#   dashboards/Homelab/          -> "Homelab"          (host + DGX + orrery-refresh + logs)
#   dashboards/Production Infra/ -> "Production Infra"  (prod uptime + Cloudflare, Hetzner bulletins)
#   (the podcast, prod-box and delivery boards moved to chipi/infra's grafana_sync, folder o11y)
#   dashboards/Home Automation/  -> "Home Automation"   (Home Assistant: P1 energy; chipi/home-automation)
#   dashboards/CI Ops/           -> "CI Ops"            (GitHub Actions deploy/backup + CI/DORA
#                                   health from ops_event/v1 in VictoriaLogs)
apiVersion: 1

providers:
  - name: homelab
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
