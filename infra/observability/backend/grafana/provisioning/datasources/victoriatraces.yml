# Provisioned datasources for VictoriaTraces — reached over the internal compose
# bridge. VictoriaTraces speaks BOTH the Jaeger and Tempo query APIs, so we use
# Grafana's built-in jaeger/tempo datasources (no plugin needed). Tempo enables
# the service graph + the Explore Traces app (grafana-exploretraces-app).
apiVersion: 1

datasources:
  - name: VictoriaTraces (Jaeger)
    uid: victoriatraces-jaeger
    type: jaeger
    access: proxy
    url: http://victoriatraces:10428/select/jaeger/
    editable: false

  - name: VictoriaTraces (Tempo)
    uid: victoriatraces-tempo
    type: tempo
    access: proxy
    url: http://victoriatraces:10428/select/tempo
    editable: false
    # Trace -> logs (the reverse of the VictoriaLogs derived field). NOT tracesToLogsV2:
    # Grafana 11.6 builds that link only for loki / elasticsearch / opensearch / splunk /
    # falconlogscale / googlecloud-logging datasources (read in its bundle, 2026-10-14), so
    # for VictoriaLogs it never rendered — the old setting did nothing.
    #
    # A correlation adds a "Logs for this trace" link to every span instead. It cannot
    # be provisioned here on Grafana 11.6 (the provisioner panics on a top-level `type`
    # and stores an empty config without it), so it is defined in git at
    # ../../correlations/correlations.json and applied by ../../correlations/ensure.py.
