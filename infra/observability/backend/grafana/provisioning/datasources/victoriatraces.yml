# Provisioned datasources for VictoriaTraces — reached over the internal compose
# bridge. VictoriaTraces speaks BOTH the Jaeger and Tempo query APIs, so we use
# Grafana's built-in jaeger/tempo datasources (no plugin needed). Tempo enables
# the service graph + the Explore Traces app (grafana-exploretraces-app).
apiVersion: 1

datasources:
  - name: VictoriaTraces (Jaeger)
    uid: victoriatraces-jaeger
    type: jaeger
    access: proxy
    url: http://victoriatraces:10428/select/jaeger/
    editable: false

  - name: VictoriaTraces (Tempo)
    uid: victoriatraces-tempo
    type: tempo
    access: proxy
    url: http://victoriatraces:10428/select/tempo
    editable: false
    jsonData:
      # Correlation click-through (ADR-119, G3a): from a trace span, jump to its
      # correlated logs in VictoriaLogs — the reverse of the VictoriaLogs
      # derivedField (log -> trace), completing the round-trip.
      #
      # The apps write the id as its own token (`trace=<id>`, `trace_id=<id>`,
      # `"trace_id":"<id>"`), so a phrase search for the id finds every line of the
      # trace — VictoriaLogs' token index makes it cheap. The old query only read a
      # `trace_id` field (30 lines/day carried it) and request-header fields no log
      # has, so it returned 0 for real traces (verified on two player-api traces
      # 2026-10-14: old query 0 lines, phrase 1 — the line that served the request).
      # $$ escapes Grafana's provisioning env-interpolation so the datasource receives
      # the literal ${__trace.traceId} template (resolved at query time).
      tracesToLogsV2:
        datasourceUid: victorialogs
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '(trace_id:"$${__trace.traceId}" OR "$${__trace.traceId}")'
