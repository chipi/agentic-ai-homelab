# Provisioned datasource — Grafana queries VictoriaLogs over the internal
# compose bridge. Requires the victoriametrics-logs-datasource plugin
# (installed via GF_INSTALL_PLUGINS in the compose).
apiVersion: 1

datasources:
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    editable: false
    jsonData:
      # Correlation click-through (ADR-119): extract the 32-hex W3C trace id from
      # a request log and link it to the trace in VictoriaTraces, so an operator
      # pivots log -> trace in one click. (VictoriaLogs plugin is Loki-based, so
      # it honours derivedFields.)
      #
      # The trace id shapes the apps actually write (measured 2026-10-14, 24h):
      #   trace=<32hex>                              access log + pipeline bracket (~35k)
      #   [trace_id=<32hex> span_id=<16hex> ...]     OTel log correlation (player/podcast api)
      #   "trace_id":"<32hex>"  /  "trace_id": "..."  JSON events (pipeline, delivery)
      #   00-<32hex>-<16hex>-<flags>                 traceparent header, if ever logged
      #   sentry-trace: <32hex>-<16hex>              Sentry header, if ever logged
      # The old `<32hex>-<16hex>`-only regex matched none of the first three, so app logs
      # never showed the link. Alloy's own `trace_id=` graph logs (the reason for the old
      # restriction) are not in VictoriaLogs (0 lines in 6h, 2026-10-14).
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: '(?:trace_id[=":\s]+|trace=|00-|sentry-trace[=":\s]+)([a-f0-9]{32})'
          datasourceUid: victoriatraces-tempo
          url: "$${__value.raw}"
          urlDisplayLabel: "View trace"
