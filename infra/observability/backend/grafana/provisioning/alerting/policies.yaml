# Notification routing — route by SEVERITY, not by channel. The tree stays stable
# as you add/remove channels; you only re-point a route's `receiver`.
#
# Everything not muted or meta falls to the root receiver (email). There is no
# GlitchTip route; see the removal note below and the alerting README.
apiVersion: 1

policies:
  - orgId: 1
    receiver: default
    group_by: ["alertname", "job"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 24h
    routes:
      # PLUMBING states never notify (2026-08-05: DatasourceNoData emailed the
      # operator on day one of email delivery). Same truthfulness rule as the
      # banner and the fleet intake: NoData/Error are observability wiring, not
      # incidents. Muted, not deleted — still visible in Grafana + banner.
      - receiver: default
        matchers:
          - alertname =~ "DatasourceNoData|DatasourceError|Watchdog"
        mute_time_intervals: [always]
        continue: false
      # SUBSTRATE alerts (meta=true: fleetd/VM/Grafana health) terminate at the
      # operator surface ONLY. Deliberately NOT routed to GlitchTip: GlitchTip is
      # a triage-fleet SOURCE, so a critical meta alert would re-enter the fleet
      # through the side door — and a broken fleet can't triage its own
      # substrate. Matched FIRST, no continue. (Decision 2026-08-02.)
      - receiver: default
        matchers:
          - meta = "true"
        continue: false
      # (removed 2026-08-05) severity=critical -> glitchtip route: the receiver
      # was a placeholder webhook that DNS-failed, and — the real lesson — a
      # matched child route PREVENTS root-receiver fallback ("continue: true"
      # only lets LATER SIBLINGS match, it does not fall through to root), so
      # every critical was swallowed and never emailed. Architecturally dead
      # anyway: GlitchTip is a triage-fleet SOURCE — bridging alerts into it
      # double-ingests the same event.
      # Criticals now fall to the root receiver: email.
