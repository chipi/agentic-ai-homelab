# Alert rules — metric health (VictoriaMetrics) + host/edge security (VictoriaLogs).
#
# Thresholds are tuned against real baselines (2026-07-20), not guessed:
#   - no targets down now; disk 33-58% free everywhere; 5xx baseline 0; ssh
#     probes ~14/24h (tailnet). See each rule for the headroom rationale.
# `severity=critical` also opens a GlitchTip issue (policies.yaml); everything
# routes to the default channel.
apiVersion: 1

groups:
  - orgId: 1
    name: infra-health
    folder: "Alerts"
    interval: 1m
    rules:
      # --- Scrape target down ------------------------------------------------------
      # Excludes the on-demand GPU services (vllm / vllm-autoresearch / ollama) —
      # they legitimately come and go with `gpu-mode-swap`, so a blanket up==0 would
      # false-page on every mode swap. Alert only on the always-on estate.
      - uid: infra-target-down
        title: "Scrape target down (up==0)"
        condition: threshold
        for: 5m
        labels: { severity: critical, kind: infra }
        annotations:
          summary: "Target down (up==0) for 5m — {{ $labels.job }} / {{ $labels.instance }}."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'min by (job, instance) (up{job!~"vllm|vllm-autoresearch|ollama"})'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # --- Host disk low (warning <10%) -------------------------------------------
      # Nearest real value is 33% free, so 10% is pure headroom — only a genuine
      # fill trips it. Critical tier below at 5%.
      - uid: infra-disk-low
        title: "Host disk low (<10% free)"
        condition: threshold
        for: 10m
        labels: { severity: warning, kind: infra }
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} below 10% free."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'min by (instance, mountpoint) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes)'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [0.10] } }]

      # --- Host disk critical (<5%) — pages + opens a GlitchTip issue -------------
      - uid: infra-disk-crit
        title: "Host disk critical (<5% free)"
        condition: threshold
        for: 5m
        labels: { severity: critical, kind: infra }
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} below 5% free — imminent fill."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'min by (instance, mountpoint) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes)'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [0.05] } }]

      # --- Mac mini CPU temperature (warning >85°C, critical >95°C) ---------------
      # The mini runs 24/7; healthy idle ~60°C, thermal-throttles ~100°C. 85 = warn
      # headroom; 95 = imminent throttle. Source: mini_cpu_temp_celsius (osx-cpu-temp
      # SMC reader in mini-metrics).
      - uid: mini-cpu-temp-high
        title: "Mac mini CPU temp high (>85°C)"
        condition: threshold
        for: 5m
        labels: { severity: warning, kind: infra }
        annotations:
          summary: "Mac mini CPU die temp above 85°C for 5m — running hot."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'mini_cpu_temp_celsius'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [85] } }]
      - uid: mini-cpu-temp-crit
        title: "Mac mini CPU temp critical (>95°C)"
        condition: threshold
        for: 2m
        labels: { severity: critical, kind: infra }
        annotations:
          summary: "Mac mini CPU die temp above 95°C — near thermal throttle."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'mini_cpu_temp_celsius'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [95] } }]

  - orgId: 1
    name: app-health
    folder: "Alerts"
    interval: 1m
    rules:
      # --- FastAPI 5xx elevated ---------------------------------------------------
      # Baseline is 0/h. 0.01 req/s over 5m ≈ 3+ errors in 5m — past a one-off probe,
      # into a small sustained problem. Covers api / pyannote / moss (all instrumented).
      - uid: app-http-5xx
        title: "FastAPI 5xx errors elevated"
        condition: threshold
        for: 5m
        noDataState: OK
        labels: { severity: warning, kind: app }
        annotations:
          summary: "5xx from {{ $labels.job }} over 5m — check traces + GlitchTip."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [0.01] } }]

  - orgId: 1
    name: security-common
    folder: "Alerts"
    interval: 1m
    rules:
      # --- SSH auth-failure / probe spike (re-homed T-11) -------------------------
      # Loki LogQL -> VictoriaLogs LogsQL. This box's probes are "Connection closed
      # by authenticating user ... [preauth]" (not "Failed password"), so the match
      # is broad. SSH is tailnet-only (T-01) → normal ~0/5m; >15 in 5m is a real
      # burst (agent loop or an unexpected exposure).
      - uid: sec-ssh-authfail
        title: "SSH auth failures / probes spiking"
        condition: threshold
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: { tenant: common, severity: warning, kind: security }
        annotations:
          summary: "Elevated SSH auth failures/probes on prod-podcast (>15 in 5m)."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victorialogs
            model:
              expr: 'instance:prod-podcast unit:ssh.service ("Failed password" OR "Invalid user" OR "authentication failure" OR "Connection closed by authenticating user") | stats count() as value'
              queryType: instant
          - refId: reduced
            datasourceUid: __expr__
            model:
              type: reduce
              expression: q
              reducer: last
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: reduced
              conditions: [{ evaluator: { type: gt, params: [15] } }]

      # --- fail2ban issued a ban (re-homed T-11) ----------------------------------
      # Any ban is worth surfacing (someone tripped a jail). fail2ban.service is
      # flowing; 0 bans so far → fires on the first real one. Fires + opens a
      # GlitchTip issue is deliberate: a ban is a confirmed hostile event.
      - uid: sec-fail2ban-ban
        title: "fail2ban issued a ban"
        condition: threshold
        for: 0m
        noDataState: OK
        execErrState: OK
        labels: { tenant: common, severity: critical, kind: security }
        annotations:
          summary: "fail2ban banned a host on prod-podcast — a jail tripped."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victorialogs
            model:
              expr: 'instance:prod-podcast unit:fail2ban.service "Ban" -"Unban" | stats count() as value'
              queryType: instant
          - refId: reduced
            datasourceUid: __expr__
            model:
              type: reduce
              expression: q
              reducer: last
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: reduced
              conditions: [{ evaluator: { type: gt, params: [0] } }]

  # --- Orrery (orrerylearn.com VPS) --------------------------------------------
  # The launch manifest is refreshed by an on-VPS cron every 6h (Orrery RFC-035),
  # which logs `[refresh-prod-data] … ok — launches.json <n> bytes` on success
  # (only success lines carry both "ok" and "bytes") to a file the grafana-agent
  # tails as job=orrery-data-refresh. Count successes over a 7h window (> one
  # cron period); zero means a run was missed or the fetch is failing, i.e. prod
  # launch data has gone stale. noDataState=Alerting so a fully silent log
  # pipeline also trips it; a query error must not page (execErrState=OK).
  - orgId: 1
    name: orrery
    folder: "Alerts"
    interval: 1m
    rules:
      - uid: orrery-launch-data-stale
        title: "Orrery launch data stale (no refresh in 7h)"
        condition: threshold
        for: 15m
        noDataState: Alerting
        execErrState: OK
        labels: { severity: warning, kind: orrery }
        annotations:
          summary: "No successful launch-data refresh on orrerylearn.com in 7h — the 6h VPS cron missed a run or the fetch is failing (job=orrery-data-refresh)."
        data:
          - refId: q
            relativeTimeRange: { from: 25200, to: 0 }
            datasourceUid: victorialogs
            model:
              expr: 'app:orrery job:orrery-data-refresh "ok" "bytes" | stats count() as value'
              queryType: instant
          - refId: reduced
            datasourceUid: __expr__
            model:
              type: reduce
              expression: q
              reducer: last
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: reduced
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # --- fleetd cycle failing --------------------------------------------------
      # The fleet supervisor (RFC-0004) reports every cycle: fleetd PUSHES
      # fleetd_cycle{fleet,outcome,stage,version} to VM (import/prometheus — no
      # /metrics port, by design). Error/timeout SERIES only exist once a failure
      # has happened, so NoData is GOOD news — noDataState: OK is the
      # load-bearing line (2026-08-02: the default fired DatasourceNoData for 6
      # days against a healthy fleetd that had simply never failed a cycle).
      # Threshold >=2 in 30m: one transient cycle error self-heals next cycle.
      # meta=true — SUBSTRATE alert: terminates at the operator, never enters
      # the triage fleet (a broken fleet can't triage its own substrate).
      # Enforced 3x: policies.yaml (meta route, no GlitchTip issue) +
      # sources.py firing_alerts (grafana pass skips meta) + this label.
      - uid: fleetd-cycle-failing
        title: "fleetd cycle failing (error/timeout, repeated)"
        condition: threshold
        for: 0s
        noDataState: OK
        labels: { severity: critical, kind: fleet, meta: "true" }
        annotations:
          summary: "fleetd cycles failing: outcome={{ $labels.outcome }} fleet={{ $labels.fleet }}, >=2 in 30m — supervisor needs the operator. Drill-down: VictoriaLogs {service=\"fleetd\"}."
        data:
          - refId: q
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum by (fleet, outcome) (count_over_time(fleetd_cycle{outcome=~"error|timeout"}[30m]))'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [1] } }]

      # --- fleetd silent (dead-man) ------------------------------------------------
      # The inverse rule — what the old rule was accidentally being: total
      # absence of cycle samples for 3+ cycle periods (10m cadence) = fleetd
      # crashed/hung, or its VM push path is broken. HERE NoData→Alerting is
      # deliberate: silence IS the alarm. The operator's STOP flag also pauses
      # cycles, so a forgotten STOP surfaces here after ~35m (intended).
      # meta=true: operator-terminated, same 3x enforcement as above.
      - uid: fleetd-silent
        title: "fleetd silent (no cycles for 35m)"
        condition: threshold
        for: 0s
        noDataState: Alerting
        labels: { severity: critical, kind: fleet, meta: "true" }
        annotations:
          summary: "No fleetd_cycle samples for 35m — fleetd crashed/hung, VM push broken, or a STOP flag was left on. Check: fleetd/ make status; VictoriaLogs {service=\"fleetd\"}."
        data:
          - refId: q
            relativeTimeRange: { from: 2100, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum(count_over_time(fleetd_cycle[35m]))'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # --- LiteLLM gateway down ----------------------------------------------------
      # The production LLM gateway (infra/litellm). LiteLLM's own /metrics is
      # enterprise-gated, so the probe is the stack's postgres-exporter: if it
      # stops reporting, the stack is down (compose restarts together).
      - uid: litellm-gateway-down
        title: "LiteLLM gateway down (stack exporter gone)"
        condition: threshold
        for: 5m
        labels: { severity: critical, kind: infra }
        annotations:
          summary: "LiteLLM gateway stack down for 5m — production LLM routing (fleets + consumers on homelab:4001) is dead. cd ~/agentic-ai-homelab/infra/litellm && docker compose up -d."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'min(up{job="litellm-postgres"})'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [1] } }]

  # --- Delivery worker (podcast_scraper #1412 / ADR-145) -----------------------------
  - orgId: 1
    name: delivery
    folder: "Alerts"
    interval: 1m
    rules:
      # A delivery loop's /metrics scrape is gone for 5m (worker down / crash-looping).
      - uid: delivery-worker-down
        title: "Delivery worker down (up==0)"
        condition: threshold
        for: 5m
        labels: { severity: critical, kind: delivery }
        annotations:
          summary: "Delivery worker down 5m — {{ $labels.channel }}. Digests/pushes are not going out. cd ~/agentic-ai-homelab/infra/delivery && docker compose up -d."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model: { expr: 'min by (channel) (up{job="delivery"})', instant: true, queryType: instant }
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [1] } }]
      # Deliverability canary: bounce+complaint > 5% of terminal sends over 1h, held 15m.
      - uid: delivery-high-bounce
        title: "Delivery bounce/complaint rate high (>5%)"
        condition: threshold
        for: 15m
        labels: { severity: warning, kind: delivery }
        annotations:
          summary: "Bounce+complaint >5% for 15m — sending-domain reputation at risk (check Resend + DMARC alignment)."
        data:
          - refId: q
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum(rate(delivery_sent_total{status=~"bounced|complaint"}[1h])) / clamp_min(sum(rate(delivery_sent_total{status=~"delivered|bounced|complaint"}[1h])), 1)'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [0.05] } }]
      # Any envelope dead-lettered in the last hour (retries exhausted → not delivered).
      - uid: delivery-dead-letter
        title: "Delivery dead-letter in the last hour"
        condition: threshold
        for: 5m
        labels: { severity: warning, kind: delivery }
        annotations:
          summary: "{{ $values.q }} envelope(s) dead-lettered in 1h — retries exhausted; inspect delivery-* logs in VictoriaLogs."
        data:
          - refId: q
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: victoriametrics
            model: { expr: 'sum(increase(delivery_sent_total{status="dead_lettered"}[1h]))', instant: true, queryType: instant }
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [0] } }]
      # Events poller cursor hasn't advanced in >1h — bounces may not be suppressing.
      - uid: delivery-events-stalled
        title: "Delivery events poller stalled (cursor age >1h)"
        condition: threshold
        for: 10m
        labels: { severity: warning, kind: delivery }
        annotations:
          summary: "Resend events cursor age >1h — bounce/complaint suppression may be stalled."
        data:
          - refId: q
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoriametrics
            model: { expr: 'max(delivery_events_cursor_age_seconds)', instant: true, queryType: instant }
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [3600] } }]

# NOT re-homed yet — Caddy edge 5xx (the third T-11 rule). The caddy.service
# systemd journal carries only startup/runtime stdout; the Caddy JSON ACCESS log
# (with status codes) is not tailed into VictoriaLogs (status:* = 0 hits). Wire the
# access log through Alloy first, then add a rule matching `status >= 500` on it.
