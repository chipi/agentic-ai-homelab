# Alert rules — metric health (VictoriaMetrics) + host/edge security (VictoriaLogs).
#
# Thresholds are tuned against real baselines (2026-07-20), not guessed:
#   - no targets down now; disk 33-58% free everywhere; 5xx baseline 0; ssh
#     probes ~14/24h (tailnet). See each rule for the headroom rationale.
# `severity=critical` also opens a GlitchTip issue (policies.yaml); everything
# routes to the default channel.
apiVersion: 1

groups:
  - orgId: 1
    name: infra-health
    folder: "Alerts"
    interval: 1m
    rules:
      # --- Scrape target down ------------------------------------------------------
      # Excludes the on-demand GPU services (vllm / vllm-autoresearch / ollama) —
      # they legitimately come and go with `gpu-mode-swap`, so a blanket up==0 would
      # false-page on every mode swap. Alert only on the always-on estate.
      - uid: infra-target-down
        title: "Scrape target down (up==0)"
        condition: threshold
        for: 5m
        labels: { severity: critical, kind: infra }
        annotations:
          summary: "Target down (up==0) for 5m — {{ $labels.job }} / {{ $labels.instance }}."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'min by (job, instance) (up{job!~"vllm|vllm-autoresearch|ollama"})'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # --- Host disk low (warning <10%) -------------------------------------------
      # Nearest real value is 33% free, so 10% is pure headroom — only a genuine
      # fill trips it. Critical tier below at 5%. CoreSimulator volumes excluded:
      # iOS runtime images are fixed-size and permanently ~full by design
      # (2026-08-05: iOS_23D8133 at 2% free false-fired the critical tier).
      - uid: infra-disk-low
        title: "Host disk low (<10% free)"
        condition: threshold
        for: 10m
        labels: { severity: warning, kind: infra }
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} below 10% free."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'min by (instance, mountpoint) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/Library/Developer/CoreSimulator/.*"} / node_filesystem_size_bytes)'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [0.10] } }]

      # --- Host disk critical (<5%) — pages + opens a GlitchTip issue -------------
      - uid: infra-disk-crit
        title: "Host disk critical (<5% free)"
        condition: threshold
        for: 5m
        labels: { severity: critical, kind: infra }
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} below 5% free — imminent fill."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'min by (instance, mountpoint) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/Library/Developer/CoreSimulator/.*"} / node_filesystem_size_bytes)'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [0.05] } }]

      # --- Memory pressure (Linux boxes: DGX + prod) --------------------------------
      # The 2026-08-05/06 lesson: prod hit out-of-DISK and the DGX hit OOM and
      # WEDGED before anyone noticed. Disk had rules; memory had none. Baselines
      # at authoring: prod 87% available. <10% available = genuine pressure on
      # both boxes (DGX unified memory: a model load can eat it fast — 5m `for`
      # keeps one transient spike from paging). noDataState OK: these metrics
      # vanish when a box is DARK — that's the dead-man rules' job, not this one.
      - uid: infra-mem-low
        title: "Host memory low (<10% available)"
        condition: threshold
        for: 5m
        noDataState: OK
        labels: { severity: warning, kind: infra }
        annotations:
          summary: "Memory on {{ $labels.instance }} below 10% available — OOM territory approaching. Find the eater before the kernel picks one for you."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'min by (instance) (node_memory_MemAvailable_bytes{instance=~"dgx-llm-1|prod-podcast"} / node_memory_MemTotal_bytes)'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [0.10] } }]
      - uid: infra-mem-crit
        title: "Host memory critical (<5% available)"
        condition: threshold
        for: 2m
        noDataState: OK
        labels: { severity: critical, kind: infra }
        annotations:
          summary: "Memory on {{ $labels.instance }} below 5% available — OOM kill imminent."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'min by (instance) (node_memory_MemAvailable_bytes{instance=~"dgx-llm-1|prod-podcast"} / node_memory_MemTotal_bytes)'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [0.05] } }]

      # --- DGX free memory (NOT MemAvailable — see #63) -----------------------------
      # The two rules above use MemAvailable, which is correct for prod but BLIND on
      # the DGX. dgx-llm-1 is GB10 with a 130.7GB unified LPDDR5X pool: the GPU
      # allocates from system RAM, and the NVIDIA driver's _memdescAllocInternal
      # needs real pages — it cannot use page cache. MemAvailable counts the ~54GB
      # of reclaimable cache and so reads healthy while the box is dying.
      #
      # Measured against the three 2026-09 wedge events (#63) — MemAvailable never
      # dropped below 18.5%, so infra-mem-low/crit were SILENT for all of them:
      #   09-14 burst (survived)  MemAvailable 18.5%   MemFree 1.40GB
      #   FREEZE 1 (host wedged)  MemAvailable 22.5%   MemFree 4.28GB
      #   FREEZE 2 (host wedged)  MemAvailable 40.8%   MemFree 0.97GB
      #
      # Threshold 8GB, not 4GB: freeze 1 bottomed at 4.28GB and a 4GB rule would
      # have missed it. `for: 3m`, not 5m: freeze 2's episode lasted only 4 minutes.
      # noDataState OK — a dark box is dgx-silent's job.
      #
      # Re-backtested 2026-09-16 over the preceding 7 days. 5GB, 6GB and 8GB are
      # BEHAVIOURALLY IDENTICAL — 10 firings (1.4/day), both wedges caught:
      #   <4GB    8 firings — misses freeze 1 (4.28GB)
      #   <5/6/8  10 firings — catches both
      #   <10GB  11 firings
      #   <12GB  33 firings — noise starts here
      # 8 is the earliest warning inside the safe band, so it is kept. Sanity check
      # from live traffic: a healthy-but-loaded box (vLLM + a capped 35B ollama model,
      # MemFree 9.5GB) does NOT fire, while all four historical squeeze episodes do.
      #
      # This rule is PRIMARY. Unlike dgx-gpu-mem-overcommit it catches both wedges,
      # including freeze 2, which peaked at only 62.46GB of GPU — invisible to any
      # GPU-allocation threshold because the killer was GPU plus ~54GB of page cache.
      - uid: dgx-memfree-crit
        title: "DGX free memory critically low (<8GB) — host wedge risk"
        condition: threshold
        for: 3m
        noDataState: OK
        labels: { severity: critical, kind: infra }
        annotations:
          summary: "dgx-llm-1 MemFree below 8GB for 3m — this state preceded both host wedges on 2026-09-15/16. Check for concurrent GPU model loads (ollama + vLLM share the unified pool); see chipi/agentic-ai-homelab#63."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'min by (instance) (node_memory_MemFree_bytes{instance="dgx-llm-1"})'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [8000000000] } }]

      # --- DGX GPU allocation overcommit (the CAUSE, ahead of the symptom) ----------
      # Fires on total GPU allocation rather than the resulting free-memory collapse,
      # so it leads dgx-memfree-crit. Depends on the gpu-process-metrics pusher, which
      # has its own staleness rule (dgx-gpu-metrics-stale) and is currently unreliable
      # (#61) — so this is the SECONDARY signal; dgx-memfree-crit above rides
      # node_exporter and is primary.
      #
      # 75GB, raised from 60GB on 2026-09-16 after 60 proved to be the machine's
      # LEGITIMATE CEILING rather than an anomaly line. The box budgets out as:
      #   vLLM        ~30GB  (pinned: --gpu-memory-utilization=0.25)
      #   ollama      ~24GB  (worst case: a 35B model at OLLAMA_CONTEXT_LENGTH=32768)
      #   moss+pyannote+faster-whisper ~5.5GB (always on)
      #   ------------------------------------
      #   ~60GB committed at full legitimate load
      # So a >60GB rule fires on normal operation — observed live at 59.9GB with a
      # capped qwen3.5:35b resident alongside vLLM, entirely healthy.
      #
      # Threshold chosen by backtest over the 7 days to 2026-09-16, not by feel:
      #   >60GB  51 firings (7.3/day)      >70GB   7 firings (1.0/day)
      #   >65GB  46 firings (6.6/day)      >75-80  7 firings (identical to 70)
      #   >85GB   2 firings — catches NEITHER wedge
      # The cliff is between 65 and 70 (46 -> 7), and 70/75/78/80 are IDENTICAL on this
      # data, so the choice inside that range costs nothing in detection. 75 is picked
      # because it is where healthy operation empirically stops existing. MemFree by
      # GPU band over 8,867 samples — note the MAX column, not the min:
      #     GPU 65-75   n=218   MemFree min 0.71  median 11.56  max 46.00
      #     GPU 75-85   n= 37   MemFree min 1.16  median  3.83  max  6.71
      #     GPU 85+     n= 10   MemFree min 1.04  median  2.29  max  3.78
      # Above 75GB the BEST free memory ever observed is 6.71GB; the 65-75 band is
      # frequently healthy (median 11.56GB), so alerting below 75 fires on good states.
      # Samples with GPU>75GB *and* MemFree>8GB: ZERO.
      #
      # Why the envelope is not the full 128GB: page cache does not yield as the GPU
      # grows — it holds ~25-37GB across every band — so GPU+cache climbs into the
      # ceiling and MemFree is only the remainder:
      #     GPU  0-40  median GPU+cache  73.9GB      GPU 65-75  median 104.5GB
      #     GPU 55-65  median GPU+cache  97.1GB      GPU 75-85  median 110.5GB
      # Usable GPU envelope is therefore ~130 - 35 (cache) - 10 (safety) ~= 85GB.
      # If vLLM's --gpu-memory-utilization is ever raised above 0.25, this budget and
      # this threshold both have to be recomputed.
      #
      # KNOWN LIMIT: no GPU threshold can catch the freeze-2 class. That wedge peaked
      # at only 62.46GB — inside the normal band — because the killer was GPU plus
      # ~54GB of page cache, not GPU alone. dgx-memfree-crit is the only rule that
      # catches both wedges; this one exists to lead it, not to replace it.
      - uid: dgx-gpu-mem-overcommit
        title: "DGX GPU allocation overcommitted (>75GB of the 130GB unified pool)"
        condition: threshold
        for: 2m
        noDataState: OK
        labels: { severity: warning, kind: infra }
        annotations:
          summary: "dgx-llm-1 GPU processes hold more than 70GB of the shared unified pool — above the ~60GB full-legitimate-load budget (vLLM 30 pinned + ollama 24 capped + 5.5 fixed), so something is allocating beyond plan. Expect dgx-memfree-crit next if it keeps climbing."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'max by (instance) (dgx_gpu_memory_used_bytes{instance="dgx-llm-1"})'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [75000000000] } }]

      # --- Kernel OOM killer fired ---------------------------------------------------
      # The after-the-fact but NAMED signal: even when pressure spikes too fast
      # for the 5m warning, the oom_kill counter says exactly what happened —
      # no more mystery wedges. Counter verified live on prod; DGX exposes the
      # same via node exporter when up.
      - uid: infra-oom-kill
        title: "Kernel OOM killer fired"
        condition: threshold
        for: 0s
        noDataState: OK
        labels: { severity: critical, kind: infra }
        annotations:
          summary: "OOM kill(s) on {{ $labels.instance }} in the last 15m — the kernel shot a process. Check dmesg / which service died; this is the DGX-wedge signature."
        data:
          - refId: q
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum by (instance) (increase(node_vmstat_oom_kill{instance=~"dgx-llm-1|prod-podcast"}[15m]))'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      # --- Mac mini memory high --------------------------------------------------
      # macOS memory semantics differ (compressor); baseline ~60% used. >90% for
      # 10m = sustained pressure, not a Spotlight blip. The mini is also the
      # observability host — if IT goes fully dark nothing here can say so
      # (accepted substrate limit; the homepage traffic light is the fallback).
      - uid: mini-mem-high
        title: "Mac mini memory high (>90% used)"
        condition: threshold
        for: 10m
        noDataState: OK
        labels: { severity: warning, kind: infra }
        annotations:
          summary: "Mac mini memory above 90% used for 10m — sustained pressure on the observability/fleet host."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'mini_mem_used_percent'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [90] } }]

      # --- Box dead-men (DGX + prod dark) ------------------------------------------
      # The "wedged and nobody noticed" fix: a box that stops reporting for 10m
      # is DOWN regardless of why (OOM wedge, power, network). Same pattern as
      # fleetd-silent: NoData→Alerting is deliberate — silence IS the alarm.
      # node_load1 chosen because node exporter runs whenever the box is up
      # (DCGM only runs when the GPU stack does). NOT meta: the fleet may
      # triage/corroborate; the operator still sees it on the banner.
      - uid: dgx-silent
        title: "DGX dark (no samples 10m — wedged, powered off, or network)"
        condition: threshold
        for: 0s
        noDataState: Alerting
        labels: { severity: critical, kind: infra }
        annotations:
          summary: "No node samples from dgx-llm-1 for 10m. OOM-wedge signature if infra-oom-kill fired just before; otherwise power/network. ssh ops@dgx-llm-1; worst case power-cycle."
        data:
          - refId: q
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum(count_over_time(node_load1{instance="dgx-llm-1"}[10m])) or vector(0)'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [1] } }]
      - uid: prod-silent
        title: "prod-podcast dark (no samples 10m)"
        condition: threshold
        for: 0s
        noDataState: Alerting
        labels: { severity: critical, kind: infra }
        annotations:
          summary: "No node samples from prod-podcast for 10m — the production box is dark (wedge/power/network), not just an app failure."
        data:
          - refId: q
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum(count_over_time(node_load1{instance="prod-podcast"}[10m])) or vector(0)'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # mini host<->VM forward dead-man's switch. The forward-watchdog (mini-metrics)
      # heart-beats mini_forward_up=1 over the FORWARDED :8428; when lima's host
      # forward breaks on a network transition the heartbeat stops (host CLI +
      # loopback ports go dark while the VM + containers keep running). NOT meta —
      # like dgx/prod-silent the fleet can still corroborate (the VM-internal
      # backend keeps running). Recovery is a graceful `colima restart` (runbook).
      - uid: mini-forward-down
        title: "Mac mini host↔VM forward down (colima socket unreachable 5m)"
        condition: threshold
        for: 0s
        noDataState: Alerting
        labels: { severity: warning, kind: infra }
        annotations:
          summary: "The mini stopped heart-beating mini_forward_up for 5m — lima's host↔VM forward likely broke on a network transition (docker socket + loopback ports dead), or the VM/watchdog is down. Containers + tailnet TLS nodes may be fine; the host CLI, loopback ports, and host metric collectors are blind. This is NOT a service outage — recover with a graceful `colima restart`. Runbook: recipes/colima-lima-forwarding-recovery.md."
        data:
          - refId: q
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum(count_over_time(mini_forward_up{box="mini"}[5m])) or vector(0)'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # --- Mac mini CPU temperature (warning >85°C, critical >95°C) ---------------
      # The mini runs 24/7; healthy idle ~60°C, thermal-throttles ~100°C. 85 = warn
      # headroom; 95 = imminent throttle. Source: mini_cpu_temp_celsius (osx-cpu-temp
      # SMC reader in mini-metrics).
      - uid: mini-cpu-temp-high
        title: "Mac mini CPU temp high (>85°C)"
        condition: threshold
        for: 5m
        labels: { severity: warning, kind: infra }
        annotations:
          summary: "Mac mini CPU die temp above 85°C for 5m — running hot."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'mini_cpu_temp_celsius'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [85] } }]
      - uid: mini-cpu-temp-crit
        title: "Mac mini CPU temp critical (>95°C)"
        condition: threshold
        for: 2m
        labels: { severity: critical, kind: infra }
        annotations:
          summary: "Mac mini CPU die temp above 95°C — near thermal throttle."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'mini_cpu_temp_celsius'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [95] } }]

  - orgId: 1
    name: billing
    folder: "Alerts"
    interval: 5m
    rules:
      # --- OpenRouter vertical spend high ------------------------------------------
      # Source: openrouter_vertical_usd (mini-metrics/openrouter-spend.sh, 10m
      # push of OpenRouter's own billing per vertical key — pi/opencode/gateway/
      # podcast). $40/mo per vertical = tunable headroom over the fleet's
      # ~$60/mo theoretical cap and July's ~$100 lab burn. Fleet food (NOT
      # meta): the triager can name the vertical, cite the ledgers, and file —
      # deciding whether the spend is legitimate stays with the operator.
      # noDataState OK: pushed metric — a paused collector isn't an overrun.
      - uid: billing-vertical-high
        title: "OpenRouter vertical spend high (over USD 40 month-to-date)"
        condition: threshold
        for: 0s
        noDataState: OK
        labels: { severity: warning, kind: billing }
        annotations:
          summary: "OpenRouter vertical '{{ $labels.vertical }}' at USD {{ $values.q }} month-to-date (threshold 40). Reconcile: homepage vertical cards vs Grafana LLM Gateway table vs fleet self-report."
        data:
          - refId: q
            relativeTimeRange: { from: 7200, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'max by (vertical) (last_over_time(openrouter_vertical_usd{window="month"}[2h]))'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [40] } }]

  - orgId: 1
    name: app-health
    folder: "Alerts"
    interval: 1m
    rules:
      # --- FastAPI 5xx elevated ---------------------------------------------------
      # Baseline is 0/h. 0.01 req/s over 5m ≈ 3+ errors in 5m — past a one-off probe,
      # into a small sustained problem. Covers api / pyannote / moss (all instrumented).
      - uid: app-http-5xx
        title: "FastAPI 5xx errors elevated"
        condition: threshold
        for: 5m
        noDataState: OK
        labels: { severity: warning, kind: app }
        annotations:
          summary: "5xx from {{ $labels.job }} over 5m — check traces + GlitchTip."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [0.01] } }]

  - orgId: 1
    name: security-common
    folder: "Alerts"
    interval: 1m
    rules:
      # --- SSH auth-failure / probe spike (re-homed T-11) -------------------------
      # Loki LogQL -> VictoriaLogs LogsQL. This box's probes are "Connection closed
      # by authenticating user ... [preauth]" (not "Failed password"), so the match
      # is broad. SSH is tailnet-only (T-01) → normal ~0/5m; >15 in 5m is a real
      # burst (agent loop or an unexpected exposure).
      - uid: sec-ssh-authfail
        title: "SSH auth failures / probes spiking"
        condition: threshold
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: { tenant: common, severity: warning, kind: security }
        annotations:
          summary: "Elevated SSH auth failures/probes on prod-podcast (>15 in 5m)."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victorialogs
            model:
              expr: 'instance:prod-podcast unit:ssh.service ("Failed password" OR "Invalid user" OR "authentication failure" OR "Connection closed by authenticating user") | stats count() as value'
              queryType: stats
          - refId: reduced
            datasourceUid: __expr__
            model:
              type: reduce
              expression: q
              reducer: last
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: reduced
              conditions: [{ evaluator: { type: gt, params: [15] } }]

      # --- fail2ban issued a ban (re-homed T-11) ----------------------------------
      # Any ban is worth surfacing (someone tripped a jail). fail2ban.service is
      # flowing; 0 bans so far → fires on the first real one. Fires + opens a
      # GlitchTip issue is deliberate: a ban is a confirmed hostile event.
      - uid: sec-fail2ban-ban
        title: "fail2ban issued a ban"
        condition: threshold
        for: 0m
        noDataState: OK
        execErrState: OK
        labels: { tenant: common, severity: critical, kind: security }
        annotations:
          summary: "fail2ban banned a host on prod-podcast — a jail tripped."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victorialogs
            model:
              expr: 'instance:prod-podcast unit:fail2ban.service "Ban" -"Unban" | stats count() as value'
              queryType: stats
          - refId: reduced
            datasourceUid: __expr__
            model:
              type: reduce
              expression: q
              reducer: last
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: reduced
              conditions: [{ evaluator: { type: gt, params: [0] } }]

  # --- Orrery (orrerylearn.com VPS) --------------------------------------------
  # The launch manifest is refreshed by an on-VPS cron every 6h (Orrery RFC-035),
  # which logs `[refresh-prod-data] … ok — launches.json <n> bytes` on success
  # (only success lines carry both "ok" and "bytes") to a file the grafana-agent
  # tails as job=orrery-data-refresh. Count successes over a 7h window (> one
  # cron period); zero means a run was missed or the fetch is failing, i.e. prod
  # launch data has gone stale. noDataState=Alerting so a fully silent log
  # pipeline also trips it; a query error must not page (execErrState=OK).
  - orgId: 1
    name: orrery
    folder: "Alerts"
    interval: 1m
    rules:
      - uid: orrery-launch-data-stale
        title: "Orrery launch data stale (no refresh in 7h)"
        condition: threshold
        for: 15m
        noDataState: Alerting
        execErrState: OK
        labels: { severity: warning, kind: orrery }
        annotations:
          summary: "No successful launch-data refresh on orrerylearn.com in 7h — the 6h VPS cron missed a run or the fetch is failing (job=orrery-data-refresh)."
        data:
          - refId: q
            relativeTimeRange: { from: 25200, to: 0 }
            datasourceUid: victorialogs
            model:
              expr: 'app:orrery job:orrery-data-refresh "ok" "bytes" | stats count() as value'
              queryType: stats
          - refId: reduced
            datasourceUid: __expr__
            model:
              type: reduce
              expression: q
              reducer: last
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: reduced
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # --- fleetd cycle failing --------------------------------------------------
      # The fleet supervisor (RFC-0004) reports every cycle: fleetd PUSHES
      # fleetd_cycle{fleet,outcome,stage,version} to VM (import/prometheus — no
      # /metrics port, by design). Error/timeout SERIES only exist once a failure
      # has happened, so NoData is GOOD news — noDataState: OK is the
      # load-bearing line (2026-08-02: the default fired DatasourceNoData for 6
      # days against a healthy fleetd that had simply never failed a cycle).
      # Threshold >=2 in 30m: one transient cycle error self-heals next cycle.
      # meta=true — SUBSTRATE alert: terminates at the operator, never enters
      # the triage fleet (a broken fleet can't triage its own substrate).
      # Enforced 3x: policies.yaml (meta route, no GlitchTip issue) +
      # sources.py firing_alerts (grafana pass skips meta) + this label.
      - uid: fleetd-cycle-failing
        title: "fleetd cycle failing (error/timeout, repeated)"
        condition: threshold
        for: 0s
        noDataState: OK
        labels: { severity: critical, kind: fleet, meta: "true" }
        annotations:
          summary: "fleetd cycles failing: outcome={{ $labels.outcome }} fleet={{ $labels.fleet }}, >=2 in 30m — supervisor needs the operator. Drill-down: VictoriaLogs {service=\"fleetd\"}."
        data:
          - refId: q
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum by (fleet, outcome) (count_over_time(fleetd_cycle{outcome=~"error|timeout"}[30m]))'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [1] } }]

      # --- bugfix-fleet mass-stuck (fail-loud) -------------------------------------
      # The bugfix-fleet runs autonomously in batches (dormant between operator
      # reviews). On a systemic failure — e.g. the litellm virtual key wiped by a
      # DB recreate (a recurring casualty) — EVERY issue in the batch errors and
      # lands in flow:stuck, silently. The metrics job (run-metrics.sh, every 120s)
      # already pushes bugfix_fleet_issues{flow}, so this is a fail-loud ALERT, not
      # fleet code. Fire on the RISE (gauge delta over 3h), NOT the absolute count:
      # a couple of genuinely-hard bugs sitting stuck long-term is normal and must
      # not page; a batch stucking 3+ at once is the systemic signal. meta=true —
      # substrate alert, terminates at the operator (a broken fix-fleet isn't triage
      # food). Threshold tunable once the normal batch/stuck rhythm is observed.
      - uid: bugfix-mass-stuck
        title: "bugfix-fleet: batch mass-stuck (systemic failure — likely wiped key)"
        condition: threshold
        for: 0s
        noDataState: OK
        labels: { severity: warning, kind: fleet, meta: "true" }
        annotations:
          summary: "bugfix-fleet flow:stuck rose by >=3 in 3h — a batch is systemically failing (likely the litellm virtual key was wiped: infra/litellm/README.md -> Recreate after a DB wipe), not slow hard-bug residue. The fix-loop is producing unreviewable output; check before the next batch."
        data:
          - refId: q
            relativeTimeRange: { from: 10800, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: '(last_over_time(bugfix_fleet_issues{flow="stuck"}[10m]) - min_over_time(bugfix_fleet_issues{flow="stuck"}[3h])) or vector(0)'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gte, params: [3] } }]

      # --- fleetd silent (dead-man) ------------------------------------------------
      # The inverse rule — what the old rule was accidentally being: total
      # absence of cycle samples for 3+ cycle periods (10m cadence) = fleetd
      # crashed/hung, or its VM push path is broken. `or vector(0)` makes the
      # query ALWAYS return a value, so silence fires as a REAL alert under the
      # rule's own name — NOT as Grafana's synthetic DatasourceNoData (which is
      # plumbing-muted everywhere; learned 2026-08-05 when the first dead-man
      # emails arrived wearing the wrong name). The operator's STOP flag also pauses
      # cycles, so a forgotten STOP surfaces here after ~35m (intended).
      # meta=true: operator-terminated, same 3x enforcement as above.
      - uid: fleetd-silent
        title: "fleetd silent (no cycles for 35m)"
        condition: threshold
        for: 0s
        noDataState: Alerting
        labels: { severity: critical, kind: fleet, meta: "true" }
        annotations:
          summary: "No fleetd_cycle samples for 35m — fleetd crashed/hung, VM push broken, or a STOP flag was left on. Check: fleetd/ make status; VictoriaLogs {service=\"fleetd\"}."
        data:
          - refId: q
            relativeTimeRange: { from: 2100, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum(count_over_time(fleetd_cycle[35m])) or vector(0)'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # --- LiteLLM gateway down ----------------------------------------------------
      # The production LLM gateway (infra/litellm). LiteLLM's own /metrics is
      # enterprise-gated, so the probe is the stack's postgres-exporter: if it
      # stops reporting, the stack is down (compose restarts together).
      - uid: litellm-gateway-down
        title: "LiteLLM gateway down (stack exporter gone)"
        condition: threshold
        for: 5m
        labels: { severity: critical, kind: infra }
        annotations:
          summary: "LiteLLM gateway stack down for 5m — production LLM routing (fleets + consumers on homelab:4001) is dead. cd ~/agentic-ai-homelab/infra/litellm && docker compose up -d."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'min(up{job="litellm-postgres"})'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [1] } }]

  # --- Langfuse trace-export health (2026-08-15 silent-401 outage; infra/langfuse-check) --
  - orgId: 1
    name: langfuse
    folder: "Alerts"
    interval: 1m
    rules:
      # LiteLLM->Langfuse trace export rejected (stale keys → 401) for 15m. LiteLLM logs
      # nothing when this happens, so this metric is the only signal. gateway=homelab now;
      # gateway=prod appears once prod's keys are wired into infra/langfuse-check/prod.env.
      - uid: langfuse-export-down
        title: "Langfuse trace-export down (LiteLLM keys rejected)"
        condition: threshold
        for: 15m
        labels: { severity: warning, kind: langfuse }
        annotations:
          summary: "LiteLLM->Langfuse trace export failing for gateway={{ $labels.gateway }} — keys rejected (401); silent LLM-observability loss. Fix: infra/litellm/.env LANGFUSE_* must equal infra/langfuse/.env LANGFUSE_INIT_PROJECT_*."
        data:
          - refId: q
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: victoriametrics
            model: { expr: 'min by (gateway) (langfuse_export_up)', instant: true, queryType: instant }
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [1] } }]

  # --- Delivery worker (podcast_scraper #1412 / ADR-145) -----------------------------
  - orgId: 1
    name: delivery
    folder: "Alerts"
    interval: 1m
    rules:
      # A delivery loop's /metrics scrape is gone for 5m (worker down / crash-looping).
      - uid: delivery-worker-down
        title: "Delivery worker down (up==0)"
        condition: threshold
        for: 5m
        labels: { severity: critical, kind: delivery }
        annotations:
          summary: "Delivery worker down 5m — {{ $labels.channel }}. Digests/pushes are not going out. cd ~/agentic-ai-homelab/infra/delivery && docker compose up -d."
        data:
          - refId: q
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model: { expr: 'min by (channel) (up{job="delivery"})', instant: true, queryType: instant }
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [1] } }]
      # Deliverability canary: bounce+complaint > 5% of terminal sends over 1h, held 15m.
      # bounced/complaint SERIES only exist once the first bounce ever happens — same
      # trap as fleetd-cycle-failing above: NoData is GOOD news, noDataState: OK is
      # load-bearing (2026-08-14→30: default NoData fired DatasourceNoData for 16 days
      # against a healthy delivery stack that had simply never bounced).
      - uid: delivery-high-bounce
        title: "Delivery bounce/complaint rate high (>5%)"
        condition: threshold
        for: 15m
        noDataState: OK
        labels: { severity: warning, kind: delivery }
        annotations:
          summary: "Bounce+complaint >5% for 15m — sending-domain reputation at risk (check Resend + DMARC alignment)."
        data:
          - refId: q
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum(rate(delivery_sent_total{status=~"bounced|complaint"}[1h])) / clamp_min(sum(rate(delivery_sent_total{status=~"delivered|bounced|complaint"}[1h])), 1)'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [0.05] } }]
      # Any envelope dead-lettered in the last hour (retries exhausted → not delivered).
      # dead_lettered series absent until the first dead-letter ever → noDataState: OK
      # (see delivery-high-bounce above).
      - uid: delivery-dead-letter
        title: "Delivery dead-letter in the last hour"
        condition: threshold
        for: 5m
        noDataState: OK
        labels: { severity: warning, kind: delivery }
        annotations:
          summary: "{{ $values.q }} envelope(s) dead-lettered in 1h — retries exhausted; inspect delivery-* logs in VictoriaLogs."
        data:
          - refId: q
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: victoriametrics
            model: { expr: 'sum(increase(delivery_sent_total{status="dead_lettered"}[1h]))', instant: true, queryType: instant }
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [0] } }]
      # Events poller cursor hasn't advanced in >1h — bounces may not be suppressing.
      - uid: delivery-events-stalled
        title: "Delivery events poller stalled (cursor age >1h)"
        condition: threshold
        for: 10m
        labels: { severity: warning, kind: delivery }
        annotations:
          summary: "Resend events cursor age >1h — bounce/complaint suppression may be stalled."
        data:
          - refId: q
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoriametrics
            model: { expr: 'max(delivery_events_cursor_age_seconds)', instant: true, queryType: instant }
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [3600] } }]

      # Digest-scheduler sidecar dead-man (podcast_scraper #1412 / ADR-146). The player's
      # digest-scheduler sidecar wakes hourly and logs one `[digest-scheduler] tick: …` line per
      # cycle (shipped via player.alloy: app=player, surface=scheduler). If those stop, the sidecar
      # is dark and no "Your Week" digests are being enqueued — the on-box healthcheck can't page,
      # so this watches it from here. Log-absence, so it CANNOT tell "died" from "not deployed yet":
      # it must be provisioned AFTER the player sidecar is live (before that it pages on absence).
      - uid: delivery-scheduler-silent
        title: "Digest scheduler silent (no ticks 2h)"
        condition: threshold
        for: 0s
        noDataState: Alerting
        execErrState: OK
        labels: { severity: warning, kind: delivery }
        annotations:
          summary: "No digest-scheduler ticks in 2h — the player sidecar is dark; 'Your Week' digests are not being enqueued. On prod: docker logs player-digest-scheduler-1; the compose sidecar (restart:unless-stopped) should recover it."
        data:
          - refId: q
            relativeTimeRange: { from: 7200, to: 0 }
            datasourceUid: victorialogs
            model:
              expr: 'app:player "digest-scheduler" "tick" | stats count() as value'
              queryType: stats
          - refId: reduced
            datasourceUid: __expr__
            model:
              type: reduce
              expression: q
              reducer: last
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: reduced
              conditions: [{ evaluator: { type: lt, params: [1] } }]

  # --- Production ops health (prod-ops-health pushers) -------------------------
  # Each production app's prod_ops_health.sh (scheduled by its repo's CI, run ON
  # the prod box) pushes prod_ops_health_* gauges to VM daily; the homelab home
  # page renders them as traffic lights and greys to STALE at >26h. This is the
  # active counterpart: page the operator at >27h so a dead pusher is REPORTED,
  # not just visible-if-looked-at (GH silently disables cron workflows after
  # ~60 days of repo inactivity — the exact failure this catches). No app label
  # filter, so the next production app's pusher is covered with zero edits here.
  # noDataState=Alerting: a series absent from the whole 48h window (never
  # pushed, or >48h dead) must also trip; a VM query error must not page.
  - orgId: 1
    name: prod-ops-health
    folder: "Alerts"
    interval: 1m
    rules:
      - uid: prod-ops-health-stale
        title: "Prod ops health check stale (no run in 27h)"
        condition: threshold
        for: 15m
        noDataState: Alerting
        execErrState: OK
        labels: { severity: warning, kind: app }
        annotations:
          summary: "prod_ops_health for app={{ $labels.app }} last ran >27h ago — the daily health pusher is dead (GH cron disabled? runner or VPS broken?). The home page shows STALE; check the app repo's prod-ops-health workflow."
        data:
          - refId: q
            relativeTimeRange: { from: 172800, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'time() - last_over_time(prod_ops_health_last_run_timestamp[48h])'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [97200] } }]

      # --- DGX per-process GPU metrics dead-man -----------------------------------
      # gpu-process-metrics.sh (30s systemd timer on dgx-llm-1) is the ONLY source of
      # per-container GPU memory on the GB10 — DCGM_FI_DEV_FB_* are unavailable on
      # unified memory. If it dies, GPU attribution silently disappears exactly when a
      # saturation event would need it, so absence IS the incident (noDataState:
      # Alerting). 10m without a push = dead; the timer fires every 30s.
      - uid: dgx-gpu-metrics-stale
        title: "DGX per-process GPU metrics stale (no push in 10m)"
        condition: threshold
        for: 5m
        noDataState: Alerting
        execErrState: OK
        labels: { severity: warning, kind: infra }
        annotations:
          summary: "dgx_gpu_metrics_last_run_timestamp is >10m old — per-container GPU memory attribution is dark. On dgx-llm-1: systemctl status gpu-process-metrics.timer; journalctl -u gpu-process-metrics.service -n 20."
        data:
          - refId: q
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'time() - last_over_time(dgx_gpu_metrics_last_run_timestamp[1h])'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [600] } }]

      # --- docker-prune dead-man -------------------------------------------------
      # The weekly docker-maintenance job (infra/docker-maintenance, Sun 04:00
      # LaunchAgent on the mini) pushes homelab_maintenance_last_run_timestamp on
      # every completed run. Written 2026-08-25 but never installed, it silently
      # ran zero times while the colima datadisk grew to 83G — this rule makes
      # that failure impossible to miss again. >8d stale (weekly cadence + 1 day
      # slack) or series absent from the whole 10d window → page.
      - uid: docker-prune-stale
        title: "docker-prune weekly maintenance stale (no run in 8d)"
        condition: threshold
        for: 15m
        noDataState: Alerting
        execErrState: OK
        labels: { severity: warning, kind: infra }
        annotations:
          summary: "docker-prune hasn't completed in >8 days — colima disk bloat is accumulating again. Check: launchctl list | grep docker-prune on the mini; log at /tmp/docker-prune.log."
        data:
          - refId: q
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'time() - last_over_time(homelab_maintenance_last_run_timestamp{job="docker-prune"}[10d])'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [691200] } }]

# NOT re-homed yet — Caddy edge 5xx (the third T-11 rule). The caddy.service
# systemd journal carries only startup/runtime stdout; the Caddy JSON ACCESS log
# (with status codes) is not tailed into VictoriaLogs (status:* = 0 hits). Wire the
# access log through Alloy first, then add a rule matching `status >= 500` on it.

  # ---------------------------------------------------------------------------------
  # Podcast content pipeline + enrichment.
  #
  # Added 2026-09-14. Until then NO dashboard and NO alert in this Grafana referenced
  # enrichment, pipeline, ingest, asr, transcription or corpus — the product's core
  # work was entirely unwatched, while podcast_pipeline_* metrics and ~2600 weekly
  # pipeline_stage events sat unread. See podcast_scraper#2071.
  #
  # These are DEAD-MAN alerts first (did the work stop happening?) and failure alerts
  # second. Silence is the failure mode that cost 30h on the homelab mini and let the
  # people enricher sit dark since 2026-09-11.
  # ---------------------------------------------------------------------------------
  - orgId: 1
    name: podcast-pipeline
    folder: "Alerts"
    interval: 5m
    rules:
      # --- Ingestion stopped ------------------------------------------------------
      # The nightly runs at 03:00 daily, so 36h spans a missed night plus slack for a
      # long run. Firing means no episode has been ingested for more than a full cycle.
      - uid: podcast-ingest-stalled
        title: "Podcast ingestion has not run in 36h"
        condition: threshold
        for: 30m
        labels: { severity: critical, kind: podcast }
        annotations:
          summary: "No scheduled ingest triggered on prod-podcast for 36h — the nightly is not running."
        data:
          - refId: q
            relativeTimeRange: { from: 129600, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum(increase(podcast_scheduled_jobs_triggered_total{instance="prod-podcast"}[36h]))'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # --- Pipeline jobs failing --------------------------------------------------
      - uid: podcast-pipeline-jobs-failing
        title: "Podcast pipeline jobs failing"
        condition: threshold
        for: 15m
        labels: { severity: warning, kind: podcast }
        annotations:
          summary: "{{ $value }} pipeline job(s) ended non-succeeded on prod-podcast in 6h."
        data:
          - refId: q
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum(increase(podcast_pipeline_jobs_finished_total{instance="prod-podcast",status!="succeeded"}[6h]))'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      # --- An enricher is failing -------------------------------------------------
      # Per-enricher so one broken enricher is named rather than hidden in a run-level
      # "ok". org_web ran green for a day while deriving 0 rows.
      - uid: podcast-enricher-failing
        title: "Enricher failing on prod"
        condition: threshold
        for: 15m
        labels: { severity: warning, kind: podcast }
        annotations:
          summary: "Enricher {{ $labels.enricher_id }} recorded {{ $value }} {{ $labels.outcome }} run(s) in 6h."
        data:
          - refId: q
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum by (enricher_id, outcome) (increase(podcast_enrichment_enricher_runs_total{instance="prod-podcast",outcome=~"failed|timeout|quarantined"}[6h]))'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [0] } }]

  # =================================================================================
  # TELEMETRY INGEST DEAD-MAN SWITCHES — "is the observability itself alive?"
  #
  # Why this group exists (incident 2026-09-16, podcast_scraper#64): prod shipped NO
  # logs for 5h11m (08:29 -> 13:40) and nothing fired. `prod-podcast dark` stayed green
  # the whole time because it measures node_load1 — a METRIC — and metrics never
  # stopped: Alloy's REMOTE_WRITE_URL fell back to the raw homelab:8428 (still allowed
  # by the tailnet ACL) while LOGS_WRITE_URL fell back to homelab:9428 (revoked when
  # telemetry moved to the TLS nodes). Box alive, metrics alive, logs silently binned.
  #
  # The dangerous part is second-order. There are already 9 log-based alert rules
  # (SSH auth failures, fail2ban, ...). They use `noDataState: OK`, so when log
  # ingestion dies they do not error — they evaluate empty and go quiet. Losing the
  # signal ALSO disarms every alarm built on it, and the board gets quieter rather
  # than louder. Silence is indistinguishable from health. That is the failure mode
  # worth buying insurance against.
  #
  # Hence `noDataState: Alerting` + `execErrState: Alerting` on everything here: for a
  # dead-man switch, "no data" IS the alert, and a datasource error means the thing we
  # rely on to tell us the truth cannot be reached — also worth waking up for. This is
  # the deliberate inverse of the security rules above.
  #
  # Thresholds are measured, not guessed (24h sample, 2026-09-16):
  #   prod-podcast  quietest 15m bucket = 71 lines   (15m at 0 is unambiguous)
  #   homelab       ~9,200 per 15m
  #   dgx-llm-1     ~530 per 15m
  #
  # WHAT THIS GROUP STILL DOES NOT COVER — the honest gap, verified not assumed:
  # the 2026-09-16 incident was PARTIAL, not total. Prod kept shipping at ~30% for
  # five hours (per-job: systemd-journal 19,852 -> 2,489 over a comparable 3h window,
  # -87%, while another stream was untouched). Three candidate detectors were checked
  # against the real data and only the third works:
  #   1. dead-man on zero          — would NOT have fired; no bucket ever hit zero.
  #   2. alert on Alloy's own "dropping data" error lines — cannot work: prod does
  #      not ship its Alloy container logs (`"dropping data"` count in VictoriaLogs
  #      over the whole outage = 0, while the container's own stderr had them).
  #   3. sender-side loki_write_dropped_entries_total — exact and unambiguous, but
  #      exists ONLY for dgx-llm-1. `up{job="alloy"}` has no prod-podcast series;
  #      prod's Alloy does not scrape itself.
  # That asymmetry is the root reason the DGX had alarms for this failure class and
  # prod did not. The real fix is making prod's Alloy observable (self-scrape its
  # /metrics, deployable via deploy-config.yml, no root) — until then prod has the
  # coarse dark rule plus the statistical rate-drop rule, neither as good as a
  # counter that simply says "I threw away N lines".
  # =================================================================================
  - orgId: 1
    name: telemetry-ingest
    folder: "Alerts"
    interval: 1m
    rules:
      # --- prod logs dark ---------------------------------------------------------
      # Catches TOTAL loss of prod logs. Be clear about what it does NOT catch:
      # it would NOT have fired during the 2026-09-16 incident this group was written
      # for. Measured after the fact, every one of the 21 fifteen-minute buckets from
      # 08:30 to 13:45 was non-empty — lowest 485 lines, against a ~2000 normal — and
      # a legitimately quiet bucket the previous day held 71, LOWER than anything
      # during the outage. Shipping degraded ~70%, it never stopped, so no absolute
      # floor can separate the two.
      #
      # A relative rate-drop rule was designed as the backstop and then ABANDONED on
      # the data: prod's journal volume over 24h runs min 3 / median 845 / max 10,196
      # lines per hour on the same stream, and yesterday afternoon's legitimate
      # 66-277/hr sits BELOW the 763-874/hr measured mid-outage. Any percentage-drop
      # threshold that fires on the incident also fires most evenings. Partial
      # degradation is therefore NOT covered by volume analysis at all — it needs the
      # sender-side counter (see the group header). Total loss is covered here.
      - uid: ingest-logs-prod-dark
        title: "prod logs dark (no lines 15m) — shipping broken, box may be fine"
        condition: threshold
        for: 0m
        noDataState: Alerting
        execErrState: Alerting
        labels: { severity: critical, kind: telemetry }
        annotations:
          summary: "No log lines from prod-podcast for 15m. The box can be perfectly healthy — check the SHIPPER, not the host. Most likely Alloy lost its endpoints override: `docker inspect alloy --format '{{index .Config.Labels \"com.docker.compose.project.config_files\"}}'` must list .vps-observability-endpoints.override.yml. If missing, re-run deploy-vps-observability-endpoints.yml (a bare `docker compose up -d alloy` silently reverts to the raw, ACL-revoked homelab:9428)."
        data:
          - refId: q
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: victorialogs
            model:
              expr: 'instance:prod-podcast | stats count() as value'
              queryType: stats
          - refId: reduced
            datasourceUid: __expr__
            model:
              type: reduce
              expression: q
              reducer: last
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: reduced
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # --- homelab logs dark ------------------------------------------------------
      # Highest-volume source and the collector host itself. Partially self-defeating
      # (Grafana runs here, so a total homelab outage takes the alerting with it) —
      # kept anyway because the common case is the SHIPPER dying while the host lives,
      # which is exactly what this catches and what just happened on prod.
      - uid: ingest-logs-homelab-dark
        title: "homelab logs dark (no lines 15m)"
        condition: threshold
        for: 0m
        noDataState: Alerting
        execErrState: Alerting
        labels: { severity: critical, kind: telemetry }
        annotations:
          summary: "No log lines from homelab for 15m (normally ~9k/15m). Check the local Alloy/collector on the mini before assuming a host problem."
        data:
          - refId: q
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: victorialogs
            model:
              expr: 'instance:homelab | stats count() as value'
              queryType: stats
          - refId: reduced
            datasourceUid: __expr__
            model:
              type: reduce
              expression: q
              reducer: last
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: reduced
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # --- dgx logs dark ----------------------------------------------------------
      # WARNING, not critical, and deliberately so: the DGX is powered off on purpose,
      # and `DGX dark (no samples 10m)` already covers box-down. This rule earns its
      # place only for the logs-broken-while-box-alive case, so it should not page at
      # the same severity as a host loss. Expect it to accompany `DGX dark` during a
      # planned shutdown — that pairing is the signal that the box is off, not broken.
      - uid: ingest-logs-dgx-dark
        title: "DGX logs dark (no lines 15m)"
        condition: threshold
        for: 0m
        noDataState: Alerting
        execErrState: Alerting
        labels: { severity: warning, kind: telemetry }
        annotations:
          summary: "No log lines from dgx-llm-1 for 15m (normally ~530/15m). If `DGX dark` is also firing the box is off/wedged; if NOT, the box is alive and only log shipping is broken."
        data:
          - refId: q
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: victorialogs
            model:
              expr: 'instance:dgx-llm-1 | stats count() as value'
              queryType: stats
          - refId: reduced
            datasourceUid: __expr__
            model:
              type: reduce
              expression: q
              reducer: last
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: reduced
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # --- DGX Alloy is dropping log entries at the sender -------------------------
      # Catches the failure at the SOURCE, before the sink goes quiet: Alloy counts
      # what it throws away. Fires while logs are still partially flowing, so it beats
      # the dark rules to the punch on a degrading link rather than a dead one.
      #
      # DGX ONLY, and that asymmetry is the point: `up{job="alloy"}` and
      # loki_write_dropped_entries_total exist for dgx-llm-1 and for NOTHING else —
      # prod's Alloy does not scrape itself. That is the structural reason prod had
      # weaker coverage than the DGX going into this incident. Closing it needs a
      # scrape target added to prod's config.d (deployable via deploy-config.yml, no
      # root); until then prod is covered only by the coarser dark rule above.
      - uid: ingest-alloy-dropping-dgx
        title: "DGX Alloy is dropping log entries (sender-side)"
        condition: threshold
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels: { severity: warning, kind: telemetry }
        annotations:
          summary: "Alloy on dgx-llm-1 dropped log entries in the last 15m — the sink is rejecting or unreachable. Check `reason` (queue_is_full / ingester_error / rate_limited) and whether the logs endpoint is still permitted by the tailnet ACL."
        data:
          - refId: q
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: victoriametrics
            model:
              expr: 'sum(increase(loki_write_dropped_entries_total{instance="dgx-llm-1"}[15m])) or vector(0)'
              instant: true
              queryType: stats
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: q
              conditions: [{ evaluator: { type: gt, params: [0] } }]
