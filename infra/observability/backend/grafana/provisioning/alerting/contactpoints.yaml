# Alert notification channels — GENERIC / add-later.
#
# The point: the alert *rules* + *routing* are fixed code; the *channels* are
# pluggable. Each channel reads its secret from the grafana container env via
# $__env{...} (passed through from the backend .env by docker-compose). Leave a
# var empty and that channel is defined-but-silent — the alert still fires and is
# visible in Grafana's Alerting UI; it just doesn't deliver until you set the env
# + `docker compose up -d grafana`.
#
# To ADD a channel later: set its env in the backend .env, restart grafana, and
# (if it's not already) reference it from a route in policies.yaml. To add a NEW
# channel type (PagerDuty, Telegram, Teams, Opsgenie, …) add a receiver here with
# that type + its $__env{...} secret — no rule changes needed.
apiVersion: 1

contactPoints:
  # default — where every alert goes unless a more specific route matches.
  # Email transport is off until you set GF_SMTP_* + ALERT_EMAIL_TO in .env.
  - orgId: 1
    name: default
    receivers:
      - uid: cp-default-email
        type: email
        settings:
          addresses: "$__env{ALERT_EMAIL_TO}"
        disableResolveMessage: false

  # critical — every severity=critical alert: email (the record) AND Slack #ops-critical
  # (the "act now" channel, push on). One contact point with both integrations, because a
  # matched child route stops the fallback to the root receiver (see policies.yaml), so
  # routing criticals to Slack alone would have dropped their email. Webhook: the Homelab
  # Ops Slack app's #ops-critical incoming webhook, ALERT_SLACK_WEBHOOK_URL in the backend
  # .env (set 2026-11-01; never committed). Design: docs/recipes/slack-ops.md.
  - orgId: 1
    name: critical
    receivers:
      - uid: cp-critical-email
        type: email
        settings:
          addresses: "$__env{ALERT_EMAIL_TO}"
        disableResolveMessage: false
      - uid: cp-critical-slack
        type: slack
        settings:
          url: "$__env{ALERT_SLACK_WEBHOOK_URL}"
          # The title is itself a Slack link (<url|text>), which overrides the title link Grafana's
          # Slack integration would set (always /alerting/list, the rules page; grafana/alerting#96).
          # It opens the first alert's own rule page (alerts in one message share a rule: grouped by
          # alertname); a test notification has no rule page, so it falls back to the firing list.
          title: '<{{ with index .Alerts 0 }}{{ if .GeneratorURL }}{{ .GeneratorURL }}{{ else }}{{ reReplaceAll "/$" "" $.ExternalURL }}/alerting/groups{{ end }}{{ end }}|{{ if eq .Status "firing" }}[CRITICAL]{{ else }}[RESOLVED]{{ end }} {{ .CommonLabels.alertname }}{{ with .CommonLabels.host }} — {{ . }}{{ end }}{{ with .CommonLabels.instance }} ({{ . }}){{ end }}>'
          # Every link is named after the action it serves, one page each (operator, 2026-11-01):
          #   See this alert     .GeneratorURL  this alert rule's own page: query, graph, instance, history
          #   Mute this alert…   .SilenceURL    the silence form pre-filled for this alert only; pick a
          #                                     duration (default 2h; the form takes none from the URL),
          #                                     Save. The "…" says it is a form, not an instant mute.
          #   All firing alerts  /alerting/groups  Active notifications: every alert firing now (not
          #                                     /alerting/list, which is the rules page)
          # Resolved messages carry only "See this alert". .ExternalURL ends in "/", hence the
          # reReplaceAll (it produced //alerting/groups). The message TITLE links to
          # /alerting/list; Grafana's Slack integration sets that itself, not configurable.
          text: '{{ range .Alerts }}{{ if eq .Status "firing" }}{{ .Annotations.summary }}{{ "\n" }}{{ if .GeneratorURL }}What is happening: <{{ .GeneratorURL }}|See this alert>{{ "\n" }}{{ end }}Known and being handled? <{{ .SilenceURL }}|Mute this alert…>{{ "\n" }}{{ else }}Cleared at {{ .EndsAt.UTC.Format "15:04Z" }}.{{ if .GeneratorURL }} <{{ .GeneratorURL }}|See this alert>{{ end }}{{ "\n" }}{{ end }}{{ end }}{{ if eq .Status "firing" }}Anything else broken? <{{ reReplaceAll "/$" "" .ExternalURL }}/alerting/groups|All firing alerts>{{ end }}'
        disableResolveMessage: false

  # slack — set ALERT_SLACK_WEBHOOK_URL (an incoming-webhook URL) to activate.
  - orgId: 1
    name: slack
    receivers:
      - uid: cp-slack
        type: slack
        settings:
          url: "$__env{ALERT_SLACK_WEBHOOK_URL}"
          title: "{{ .CommonLabels.alertname }} [{{ .CommonLabels.severity }}]"
        disableResolveMessage: false

  # glitchtip — for CONFIRMED issues only (severity=critical routes here). GlitchTip
  # ingests Grafana's generic webhook as an issue. Set ALERT_GLITCHTIP_WEBHOOK_URL.
  - orgId: 1
    name: glitchtip
    receivers:
      - uid: cp-glitchtip
        type: webhook
        settings:
          url: "$__env{ALERT_GLITCHTIP_WEBHOOK_URL}"
          httpMethod: POST
        disableResolveMessage: false
