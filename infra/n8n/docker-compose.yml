# n8n: the installation's plumbing tool between the company's tools and flotilla (flotilla RFC-0014 §4.0, §4.7).
# Runs on the homelab Mac mini's production engine beside flotilla. n8n is under the Sustainable Use
# License: the installation's own internal use only, never offered to others as a service.
#
# Networks, all internal but `out` and the external `mcp` (nothing published on the host; RFC-0014 §5):
#   plumbing  n8n, flotillad (joins it as an external network) and alloy-homelab (scrapes /metrics).
#             flotillad reaches n8n's webhooks at http://n8n:5678/webhook/..., n8n reaches flotillad by
#             container name on the same network.
#   db        n8n and its Postgres only.
#   ui        n8n and the installation's caddy only (named n8n_ui): the editor at
#             https://n8n.tail6d0ed4.ts.net. Caddy is not on plumbing, so the tailnet node reaches
#             n8n's editor and nothing of flotilla's. Deploy this stack before reverse-proxy.
#   mcp       n8n and flotilla's reads proxy (egress-reads), an EXTERNAL network created before this stack: n8n's MCP read servers
#             (case 1, flows/case1-mcp-*.json) at http://n8n:5678/mcp/<path>. Not internal: the network is flotilla's plan, n8n joins it only.
#   egress    n8n and its egress proxy only (the second brain Slack bridge joins it too: it reaches Slack through the proxy).
#   sbbridge  n8n and the second brain Slack bridge (sb-bridge/docker-compose.yml, RFC-0010 A4): the bridge posts mentions to n8n's webhook here.
#   out       the proxy alone: its way to the internet. n8n itself has no route out.
# The proxy (Smokescreen, the image flotilla builds, pinned by digest) admits only the hosts in
# egress/acl.yaml, empty until a connector is decided (RFC-0010), and no private address at all.
#
# Secrets: the stack-local .env (mode 600, never in git; .env.example lists the names). The owner
# login lives in ~/n8n/owner.env on the mini (README).
name: n8n

services:
  n8n-db:
    image: postgres:17-alpine   # n8n 2.x supports 17+; 16 runs in compatibility mode only
    container_name: n8n-db
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
    volumes:
      - n8n-db-data:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  n8n:
    # Pinned. Upgrade deliberately (README "Upgrade"): n8n migrates its database on start.
    image: docker.n8n.io/n8nio/n8n:2.48.7
    container_name: n8n
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: n8n
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n:5678/              # webhooks are called inside the installation only
      N8N_EDITOR_BASE_URL: https://n8n.tail6d0ed4.ts.net/
      N8N_PROXY_HOPS: "1"                        # caddy in front of the editor
      N8N_SECURE_COOKIE: "true"                  # the browser reaches the editor over https only
      GENERIC_TIMEZONE: UTC
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_METRICS: "true"
      # per-workflow counters for the Hub (n8n_workflow_{started,success,failed}_total by workflow id and
      # name) and the Drive trigger's polls; they reset when n8n restarts, so the Hub reads increase()
      N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS: "true"
      N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: "true"
      N8N_METRICS_INCLUDE_WORKFLOW_NAME_LABEL: "true"
      N8N_METRICS_INCLUDE_POLL_TRIGGER_METRICS: "true"
      # nothing calls home: the networks give no route out, and these stop it trying
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      HTTP_PROXY: http://egress:4750
      HTTPS_PROXY: http://egress:4750
      NO_PROXY: flotillad,n8n-db,egress,localhost,127.0.0.1,n8n   # n8n: the second brain agent calls the docs and tasks MCP servers on n8n's own port; the library and the model hosts are added in the README step
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [plumbing, db, ui, egress, mcp, sbbridge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  egress:
    # flotilla's Smokescreen build (deploy/docker/smokescreen.Dockerfile there: a pinned upstream commit
    # on distroless), by digest so a flotilla release never changes it underneath.
    image: ghcr.io/chipi/flotilla-smokescreen@sha256:0be268a82ee678d60b96f9bdb12e2b3676c0f36e1129662ae0876732153cb677
    container_name: n8n-egress
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.25
    command: ["--config-file", "/etc/smokescreen/smokescreen.yaml"]
    volumes:
      - ./egress/smokescreen.yaml:/etc/smokescreen/smokescreen.yaml:ro
      - ./egress/acl.yaml:/etc/smokescreen/acl.yaml:ro
    networks: [egress, out]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  plumbing:
    name: plumbing
    internal: true
  db:
    internal: true
  ui:
    name: n8n_ui
    internal: true
  egress:
    internal: true
  sbbridge:
    name: sbbridge   # n8n and the second brain Slack bridge (sb-bridge/docker-compose.yml) only: the bridge reaches the mention webhook, nothing else
    internal: true
  out: {}
  mcp:
    name: mcp
    external: true   # created before this stack (README "Case 1 read servers (MCP)"): n8n joins it and never creates it

volumes:
  n8n-db-data:
  n8n-data:
