# Tenant registry — one entry per product using the shared delivery engine.
# Secrets are referenced by ENV NAME (resolved from the container env / .env), never inline.
# Onboard a new tenant: add an entry + delivery/templates/<name>/ + schema/<name>/ + its
# secrets in .env. No code change. One Resend account verifies each tenant's mail_from domain.

tenants:
  podcast:
    outbox_base_url: http://100.124.111.115:8099        # prod player API over the tailnet
    internal_token_env: PODCAST_INTERNAL_OUTBOX_TOKEN
    vapid_private_key_env: PODCAST_VAPID_PRIVATE_KEY
    mail_from: "Close Listening <digest@mail.closelistening.app>"
    app_origin: https://closelistening.app
    unsubscribe_path: /api/app/comms/unsubscribe
    vapid_subject: mailto:info@closelistening.app

  # Dev/test twin of podcast — drains a LOCAL player-api outbox so dev/test and prod
  # deliver at the SAME time (one worker per tenant). Reuses podcast's templates +
  # schema. SANDBOXED: mail_from must be a Resend-VERIFIED TEST domain so a test
  # drain can never reach real inboxes; its own token + VAPID isolate it from prod.
  # Activate (all required, or leave commented):
  #   1. local player-api running on :8092 implementing /internal/outbox/*
  #   2. set PODCAST_DEV_INTERNAL_OUTBOX_TOKEN + PODCAST_DEV_VAPID_PRIVATE_KEY in .env
  #   3. verify the sandbox mail_from domain in Resend
  #   4. symlink templates/podcast-dev -> podcast and schema/podcast-dev -> podcast
  #      (templates/ is box-local — not in git)
  #   5. uncomment, then `docker compose up -d` the delivery stack
  # See docs/wip/mac-mini-headless-server.md.
  # podcast-dev:
  #   outbox_base_url: http://127.0.0.1:8092
  #   internal_token_env: PODCAST_DEV_INTERNAL_OUTBOX_TOKEN
  #   vapid_private_key_env: PODCAST_DEV_VAPID_PRIVATE_KEY
  #   mail_from: "Close Listening (dev) <digest@REPLACE-with-resend-verified-sandbox>"
  #   app_origin: http://127.0.0.1:8092
  #   unsubscribe_path: /api/app/comms/unsubscribe
  #   vapid_subject: mailto:info@closelistening.app

  # Example second tenant — orrery. Enable by verifying mail.orrerylearn.com in Resend,
  # generating an orrery VAPID keypair, filling its secrets, and adding its templates/schema.
  # Commented out until its outbox implements the /internal/outbox/* seam.
  # orrery:
  #   outbox_base_url: http://127.0.0.1:9200
  #   internal_token_env: ORRERY_INTERNAL_OUTBOX_TOKEN
  #   vapid_private_key_env: ORRERY_VAPID_PRIVATE_KEY
  #   mail_from: "Orrery <updates@mail.orrerylearn.com>"
  #   app_origin: https://orrerylearn.com
  #   unsubscribe_path: /api/comms/unsubscribe
  #   vapid_subject: mailto:hello@orrerylearn.com
