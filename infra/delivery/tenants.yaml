# Tenant registry — one entry per product using the shared delivery engine.
# Secrets are referenced by ENV NAME (resolved from the container env / .env), never inline.
# Onboard a new tenant: add an entry + delivery/templates/<name>/ + schema/<name>/ + its
# secrets in .env. No code change. One Resend account verifies each tenant's mail_from domain.

tenants:
  podcast:
    outbox_base_url: http://100.124.111.115:8099        # prod player API over the tailnet
    internal_token_env: PODCAST_INTERNAL_OUTBOX_TOKEN
    vapid_private_key_env: PODCAST_VAPID_PRIVATE_KEY
    mail_from: "Close Listening <digest@mail.closelistening.app>"
    app_origin: https://closelistening.app
    unsubscribe_path: /api/app/comms/unsubscribe
    vapid_subject: mailto:info@closelistening.app
    # APNs (native iOS push). The .p8 auth key rides in .env by name; the rest are non-secret ids.
    # A prod build ships via TestFlight/App Store, so its device tokens are PRODUCTION → apns_sandbox
    # stays false here. (A worker draining a dev outbox of development-signed / devicectl tokens would
    # set apns_sandbox: true.) Fill apns_key_id with the .p8's Key ID from the Apple Developer portal.
    apns_key_env: PODCAST_APNS_AUTH_KEY
    apns_key_id: "38KC9BBJM4"
    apns_team_id: "3P3PX275ZM"
    apns_bundle_id: app.closelistening.player
    apns_sandbox: false

  # Dev/test twin of podcast — drains the LOCAL dev player-api outbox (:8092)
  # alongside prod, so dev and prod deliver at the same time (one worker per
  # tenant). Reuses podcast's secrets, templates, and schema — ONLY the outbox URL
  # differs. Dev is ephemeral: when nothing runs on :8092 the worker just logs a
  # warning each poll and idles (no alert — liveness is process-based, worker.py).
  # It SENDS for real via podcast's mail_from, so keep dev outbox data on safe
  # recipients. Requires templates/podcast-dev + schema/podcast-dev symlinks ->
  # podcast (templates/ is box-local, not in git).
  podcast-dev:
    # Where the dev outbox lives moves with the worktree (mini host or laptop over
    # the tailnet), so the URL is env-overridable via PODCAST_DEV_OUTBOX_URL. Port
    # 8000 = the `make serve-api` dev API (which serves /internal/outbox), now
    # bound 0.0.0.0 by default so it's tailnet-reachable. Default below = a dev API
    # in a mini worktree (host.docker.internal:8000). Use the `dev-outbox` helper
    # (infra/delivery/bin/dev-outbox.sh) to point at the laptop instead:
    #   dev-outbox laptop   # → PODCAST_DEV_OUTBOX_URL=http://<laptop-tailnet>:8000
    outbox_base_url_env: PODCAST_DEV_OUTBOX_URL
    # NO literal fallback on purpose: export PODCAST_DEV_OUTBOX_URL to activate this tenant
    # locally. Without it the tenant is skipped entirely (see tenant.py load_registry), so the
    # always-on homelab worker does not poll a developer-laptop address it can never reach.
    # outbox_base_url: http://host.docker.internal:8000
    internal_token_env: PODCAST_INTERNAL_OUTBOX_TOKEN
    vapid_private_key_env: PODCAST_VAPID_PRIVATE_KEY
    mail_from: "Close Listening <digest@mail.closelistening.app>"
    app_origin: https://closelistening.app
    unsubscribe_path: /api/app/comms/unsubscribe
    vapid_subject: mailto:info@closelistening.app
    # APNs (native iOS) — SANDBOX, for dev-signed device builds (Xcode/devicectl),
    # whose tokens are sandbox-scoped. Same .p8 key as prod (env-agnostic); only the
    # host differs. This is why a dev build can't hit the prod `podcast` tenant.
    apns_key_env: PODCAST_APNS_AUTH_KEY
    apns_key_id: "38KC9BBJM4"
    apns_team_id: "3P3PX275ZM"
    apns_bundle_id: app.closelistening.player
    apns_sandbox: true

  # Example second tenant — orrery. Enable by verifying mail.orrerylearn.com in Resend,
  # generating an orrery VAPID keypair, filling its secrets, and adding its templates/schema.
  # Commented out until its outbox implements the /internal/outbox/* seam.
  # orrery:
  #   outbox_base_url: http://127.0.0.1:9200
  #   internal_token_env: ORRERY_INTERNAL_OUTBOX_TOKEN
  #   vapid_private_key_env: ORRERY_VAPID_PRIVATE_KEY
  #   mail_from: "Orrery <updates@mail.orrerylearn.com>"
  #   app_origin: https://orrerylearn.com
  #   unsubscribe_path: /api/comms/unsubscribe
  #   vapid_subject: mailto:hello@orrerylearn.com
