# RFC-0008 plan phase 3: LibreChat and Open WebUI side by side, on the X3, while the operator tests
# them; then the chosen one moves to the mini. Both talk to the mini's LiteLLM (model `assistant`: the
# X3 first, OpenRouter as failover; key assistant-ui-eval, `assistant` only) and to Grafana's MCP server.
# Ports on loopback only; `tailscale serve` publishes them over HTTPS on the tailnet (README).
# Secrets in .env next to this file (gitignored; see .env.example).
# o11y: LLM calls are traced in Langfuse by the gateway (project agents, key assistant-ui-eval); the
# UIs send their own traces to VictoriaTraces (services librechat, open-webui); the X3 collector
# ships these containers' logs and scrapes LibreChat's and mcp-grafana's /metrics
# (infra/observability/hosts/x3/config.alloy); Open WebUI pushes its metrics over OTLP.
# Gateway by its full tailnet name: LibreChat's image (musl) ignores the search domain.
name: assistant-ui-eval

services:
  librechat:
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.8
    container_name: assistant-eval-librechat
    restart: unless-stopped
    mem_limit: 1536m
    depends_on: [mongodb, meilisearch, mcp-grafana]
    ports: ["127.0.0.1:3080:3080"]
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      DOMAIN_CLIENT: https://omarchy.tail6d0ed4.ts.net:8443
      DOMAIN_SERVER: https://omarchy.tail6d0ed4.ts.net:8443
      TRUST_PROXY: "1"
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      CREDS_KEY: ${CREDS_KEY}
      CREDS_IV: ${CREDS_IV}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOW_REGISTRATION: ${LIBRECHAT_ALLOW_REGISTRATION:-true}
      ALLOW_SOCIAL_LOGIN: "false"
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      APP_TITLE: "Homelab assistant (LibreChat, evaluation)"
      METRICS_SECRET: ${LIBRECHAT_METRICS_SECRET}
      OTEL_TRACING_ENABLED: "true"
      OTEL_SERVICE_NAME: librechat
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=eval,host.name=x3
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: https://vtraces.tail6d0ed4.ts.net/insert/opentelemetry/v1/traces
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro

  mongodb:
    image: mongo:8.0.20
    container_name: assistant-eval-mongodb
    restart: unless-stopped
    mem_limit: 768m
    command: mongod --noauth --wiredTigerCacheSizeGB 0.25
    volumes: [mongo:/data/db]

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    container_name: assistant-eval-meilisearch
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes: [meili:/meili_data]

  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.12.5
    container_name: assistant-eval-openwebui
    restart: unless-stopped
    mem_limit: 2g
    depends_on: [mcp-grafana]
    ports: ["127.0.0.1:3081:8080"]
    environment:
      WEBUI_NAME: "Homelab assistant (Open WebUI, evaluation)"
      WEBUI_URL: https://omarchy.tail6d0ed4.ts.net:8444
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: http://homelab.tail6d0ed4.ts.net:4001/v1
      OPENAI_API_KEY: ${LITELLM_API_KEY}
      ENABLE_SIGNUP: ${OPENWEBUI_ENABLE_SIGNUP:-true}
      DEFAULT_MODELS: assistant
      ANONYMIZED_TELEMETRY: "false"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ENABLE_OTEL: "true"
      ENABLE_OTEL_TRACES: "true"
      ENABLE_OTEL_METRICS: "true"
      OTEL_SERVICE_NAME: open-webui
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=eval,host.name=x3
      OTEL_OTLP_SPAN_EXPORTER: http
      OTEL_METRICS_OTLP_SPAN_EXPORTER: http
      OTEL_EXPORTER_OTLP_ENDPOINT: https://vtraces.tail6d0ed4.ts.net/insert/opentelemetry/v1/traces
      OTEL_METRICS_EXPORTER_OTLP_ENDPOINT: https://vm.tail6d0ed4.ts.net/opentelemetry/v1/metrics
      OTEL_METRICS_EXPORT_INTERVAL_MILLIS: "30000"
    volumes: [openwebui:/app/backend/data]

  mcp-grafana:
    image: grafana/mcp-grafana:2.1.1
    container_name: assistant-eval-mcp-grafana
    restart: unless-stopped
    mem_limit: 256m
    ports: ["127.0.0.1:3082:9090"]
    command: ["-t", "streamable-http", "--address", "0.0.0.0:8000", "--metrics", "--metrics-address", "0.0.0.0:9090", "--allowed-hosts", "mcp-grafana:8000", "--usage-stats", "disabled", "--disable-write", "--enabled-tools", "search,datasource,prometheus,alerting,dashboard"]
    environment:
      GRAFANA_URL: https://grafana.tail6d0ed4.ts.net
      GRAFANA_ORG_ID: "1"
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}

volumes:
  mongo:
  meili:
  openwebui:
