# LibreChat config for the RFC-0008 UI evaluation (v0.8.8, config version 1.3.17).
version: 1.3.17
cache: true

interface:
  customWelcome: "Homelab assistant (evaluation). Model: assistant through the homelab gateway. Tools: Grafana (read-only)."

endpoints:
  custom:
    - name: "Homelab gateway"
      apiKey: "${LITELLM_API_KEY}"
      baseURL: "https://litellm.tail6d0ed4.ts.net/v1"
      models:
        default: ["assistant"]
        fetch: false
      titleConvo: true
      titleModel: "assistant"
      modelDisplayLabel: "Homelab"

# The MCP server is on the stack's internal network: an SSRF exemption for exactly that host and port
# (allowedAddresses), not a whitelist (allowedDomains would block every public destination).
mcpSettings:
  allowedAddresses:
    - 'mcp-grafana:8000'

mcpServers:
  grafana:
    type: streamable-http
    url: http://mcp-grafana:8000/mcp
    timeout: 60000

# The same system prompt as Open WebUI's (system-prompt.txt) and tools; generated by apply-ui-config.py,
# do not edit by hand. Actions may call the hub and GlitchTip only. The default spec opens on the "Homelab assistant" agent
# (prompt, model `assistant`, Grafana tools, hub status action), not on "My Agents".
actions:
  allowedDomains: ["hub.tail6d0ed4.ts.net", "glitchtip.tail6d0ed4.ts.net"]
  allowedAddresses: ["hub.tail6d0ed4.ts.net:443", "100.120.76.68:443", "glitchtip.tail6d0ed4.ts.net:443", "100.121.204.22:443"]

modelSpecs:
  prioritize: true
  list:
    - name: homelab-assistant
      label: "Homelab assistant"
      description: "assistant on the X3 (OpenRouter as failover), Grafana tools, hub status"
      default: true
      mcpServers: ["grafana"]
      preset:
        endpoint: "agents"
        agent_id: "agent_us2ZFQ9OI39pddwv4-nZl"
