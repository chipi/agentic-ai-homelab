# LiteLLM gateway config — model ALIASES are the contract; routes behind them
# are swappable per-alias without touching any consumer (the whole point:
# OpenRouter today, direct DeepSeek/Moonshot/Z.ai/US providers tomorrow).
#
# Consumers call aliases (fleet-triage-flash, ...), never provider names —
# so eval stamps, RATES tables, and fleet configs survive provider swaps.

model_list:
  # --- fleet aliases (production traffic) ---------------------------------
  - model_name: fleet-triage-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: fleet-triage-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: fleet-bugfix-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
  # bugfix-fleet triage/dispatch (cheap) + reviewer (glm). Routes the bugfix-fleet
  # through the gateway too (was OpenRouter-direct) — one budget key, one meter.
  - model_name: fleet-bugfix-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: fleet-bugfix-reviewer
    litellm_params:
      model: openrouter/z-ai/glm-5.2
      api_key: os.environ/OPENROUTER_API_KEY

  # --- direct-provider test aliases (provider bake-off; A/B vs OpenRouter) --
  # Same underlying models via api.deepseek.com. Names follow DeepSeek's
  # post-2026-07-24 scheme (deepseek-chat/reasoner deprecated).
  - model_name: test-deepseek-direct-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: test-deepseek-direct-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY

  # --- general-purpose aliases (other homelab projects) -------------------
  - model_name: homelab-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: homelab-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: homelab-glm
    litellm_params:
      model: openrouter/z-ai/glm-5.2
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: homelab-glm47-flash
    litellm_params:
      model: openrouter/z-ai/glm-4.7-flash
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: homelab-kimi
    litellm_params:
      model: openrouter/moonshotai/kimi-k2.6
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: homelab-qwen
    litellm_params:
      model: openrouter/qwen/qwen3.6-35b-a3b
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: homelab-qwen37-flash
    litellm_params:
      model: openrouter/qwen/qwen3.7-flash
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: homelab-qwen37-plus
    litellm_params:
      model: openrouter/qwen/qwen3.7-plus
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: homelab-qwen38-max
    litellm_params:
      model: openrouter/qwen/qwen3.8-max
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: homelab-flash-0731
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash-0731
      api_key: os.environ/OPENROUTER_API_KEY

  # Podcast bake-off, ISOLATED on its own OpenRouter workspace key so its spend
  # can't drain the shared weekly budget the fleet routes on (#1412 incident).
  # Same underlying model as homelab-flash-0731, different api_key/account.
  - model_name: podcast-flash-0731
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash-0731
      api_key: os.environ/OPENROUTER_API_KEY_PODCAST

  # ── Orrery Physics Lab /ask (dev path — mirrors the prod gateway's alias;
  # same DEDICATED OpenRouter key on both, operator 2026-09-06) ──
  - model_name: orrery-ask
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY_ORRERY

  # ── eval-harness. Anthropic is reached THROUGH OpenRouter, so the gateway
  # holds no Anthropic credential of its own.
  #
  # On the PODCAST key, deliberately: what these aliases evaluate IS the podcast
  # work, so its spend belongs to the podcast vertical's $25 rather than to a
  # fourth one. #1412 says a workload must not spend ANOTHER's budget — this is
  # the same budget's own measurement, and splitting it would only hide what the
  # podcast bake-off actually costs to know about.
  #
  # opus is the GOLDEN: references are authored once with the strongest model
  # available, and every cheaper arm is then scored against them. sonnet/haiku
  # are sweep arms. Consumers hold ONE virtual key (alias eval-harness),
  # scoped to exactly these aliases.
  - model_name: eval-claude-opus
    litellm_params:
      model: openrouter/anthropic/claude-opus-5.5
      api_key: os.environ/OPENROUTER_API_KEY_PODCAST
  - model_name: eval-claude-sonnet
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5
      api_key: os.environ/OPENROUTER_API_KEY_PODCAST
  - model_name: eval-claude-haiku
    litellm_params:
      model: openrouter/anthropic/claude-haiku-4.5
      api_key: os.environ/OPENROUTER_API_KEY_PODCAST

  # ── open-weight and OpenAI arms for the summarisation eval example ────────────
  #
  # All on OPENROUTER_API_KEY_PODCAST, like the eval-claude-* aliases above: the eval
  # vertical's spend stays inside the eval vertical's budget, so a sweep across a dozen
  # models cannot drain the fleet's or orrery's. That isolation is the reason these are
  # separate aliases rather than reuse of the homelab-* ones, which point at the same
  # upstreams through a different key.
  #
  # Model ids were read from OpenRouter's /api/v1/models rather than recalled — a wrong id
  # fails at request time, halfway through a paid sweep.
  - model_name: eval-llama-70b
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: os.environ/OPENROUTER_API_KEY_PODCAST

  - model_name: eval-llama-scout
    litellm_params:
      model: openrouter/meta-llama/llama-4-scout
      api_key: os.environ/OPENROUTER_API_KEY_PODCAST

  - model_name: eval-gemma-31b
    litellm_params:
      model: openrouter/google/gemma-4-31b-it
      api_key: os.environ/OPENROUTER_API_KEY_PODCAST

  - model_name: eval-qwen-flash
    litellm_params:
      model: openrouter/qwen/qwen3.8-flash
      api_key: os.environ/OPENROUTER_API_KEY_PODCAST

  - model_name: eval-deepseek-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY_PODCAST

  - model_name: eval-gpt-mini
    litellm_params:
      model: openrouter/openai/gpt-5.4-mini
      api_key: os.environ/OPENROUTER_API_KEY_PODCAST

  - model_name: eval-gpt
    litellm_params:
      model: openrouter/openai/gpt-5.5
      api_key: os.environ/OPENROUTER_API_KEY_PODCAST

litellm_settings:
  # full-package observability from day one (operator requirement):
  # Langfuse traces on success+failure, GlitchTip (sentry-compatible) on failure
  success_callback: ["langfuse"]
  failure_callback: ["langfuse", "sentry"]
  num_retries: 6
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # virtual keys + budgets live in postgres (DATABASE_URL from compose)
