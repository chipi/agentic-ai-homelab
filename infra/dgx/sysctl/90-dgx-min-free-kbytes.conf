# Keep ~7.5 GiB of memory FREE on dgx-llm-1 (GB10 unified memory: CPU and GPU share one pool).
#
# Why (agentic-ai-homelab #71, #81, 2026-10-01): the September host wedges (#63, #65)
# came from GPU allocations plus a large page cache squeezing free memory — freeze 2 had
# MemFree 0.97 GB with ~54 GB of cache. The stock floor here was 45 MB, so the kernel let
# cache fill nearly all free memory and reclaimed only on demand. After a vLLM reload read
# ~17 GiB of weights, cache went 36 -> 53 GB and MemFree 9.9 -> 3.3 GB.
#
# Effect: kswapd starts reclaiming at the low watermark = min + min/4 and stops at high =
# min + min/2, so free memory floats ~9.4-11.3 GiB — above the 8 GB dgx-memfree-crit line
# with margin (6 GiB would have sat at 7.5-9 GiB, on the line). Clean page cache is what
# gets reclaimed; it is a cache, not lost data.
#
# Install: sudo cp 90-dgx-min-free-kbytes.conf /etc/sysctl.d/ && sudo sysctl --system
# Rollback: sudo rm /etc/sysctl.d/90-dgx-min-free-kbytes.conf && sudo sysctl -w vm.min_free_kbytes=45167
vm.min_free_kbytes = 7864320
