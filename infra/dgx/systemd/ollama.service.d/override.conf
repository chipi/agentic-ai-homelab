[Service]
Environment="OLLAMA_HOST=0.0.0.0"
# Cap KV-cache size. Unified LPDDR5X pool is shared with vLLM; the model default
# (262144) made an 8B model occupy ~30GB and drove MemFree to <1GB, wedging the
# host twice on 2026-09-15/16. See chipi/agentic-ai-homelab#63.
Environment="OLLAMA_CONTEXT_LENGTH=32768"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
# Hold back vLLM's resident footprint; ollama reads the unified pool free figure
# and would otherwise treat vLLM memory as available to itself.
Environment="OLLAMA_GPU_OVERHEAD=34359738368"
