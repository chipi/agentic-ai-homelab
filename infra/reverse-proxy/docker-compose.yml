# Durable service exposure — Caddy + Tailscale plugin. Each service is its own
# tailnet node (<name>.tail6d0ed4.ts.net) with a real Tailscale cert. No host
# ports are published: the listeners live on the tailnet via tsnet. Backends are
# reached over each stack's docker network. Needs TS_AUTHKEY (reusable, tagged
# tag:homelab-svc) in .env. See ADR-0006 ("Implementation update").
services:
  caddy:
    build: .
    image: caddy-tailscale:local
    container_name: caddy
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set TS_AUTHKEY (reusable, tag:homelab-svc) in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # persists each node's tsnet identity + certs
      - caddy_config:/config
    networks:
      - backend_default
      - litellm_default
      - langfuse_default
      - umami_default
      - glitchtip_default
      - evals_default
      - fleet-evals_default
      - home-automation_default
      - flotilla_ui

  # flotilla's host-agent endpoint (chipi/flotilla ADR-0006): the agents' mutual TLS is flotillad's
  # own, so this node only passes TCP 8487 through to flotillad (TS_SERVE_CONFIG, raw TCP forward);
  # Caddy cannot, and keeping it out of Caddy means a fault here leaves every other node up. The
  # name agents dial, flotilla-hosts.tail6d0ed4.ts.net, is in flotillad's hosts.server_names.
  flotilla-hosts:
    image: tailscale/tailscale@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4   # 1.104.7
    container_name: flotilla-hosts
    hostname: flotilla-hosts
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set TS_AUTHKEY (reusable, tag:homelab-svc) in .env}
      - TS_HOSTNAME=flotilla-hosts
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./flotilla-hosts.serve.json:/config/serve.json:ro
      - flotilla_hosts_state:/var/lib/tailscale   # the node's identity, so it keeps its name
    networks:
      - default       # out to Tailscale's coordination server
      - flotilla_ui   # to flotillad:8487

volumes:
  caddy_data:
  caddy_config:
  flotilla_hosts_state:

networks:
  backend_default:
    external: true
  litellm_default:
    external: true
  langfuse_default:
    external: true
  umami_default:
    external: true
  glitchtip_default:
    external: true
  evals_default:
    external: true
  fleet-evals_default:
    external: true
  home-automation_default:
    external: true
  # flotilla's UI network (chipi/flotilla ADR-0014), internal, created by flotilla's own compose. ORDER: deploy
  # flotilla with the UI first; until this network exists, `docker compose up` here fails and every node
  # above goes down with it.
  flotilla_ui:
    external: true
