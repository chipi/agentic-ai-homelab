# vLLM prod-vllm — the production serving vLLM.
#
# A copy of the autoresearch stack's serving config, kept as its OWN named
# stack so "autoresearch" (eval / sweep target) and "prod-vllm" (production
# serving) are separate owners of the GPU rather than one folder doing double
# duty. Same GB10 GPU, same single-owner-at-a-time rule as coder-next /
# autoresearch / judge-* — enforced by gpu-mode-swap.sh (mode `prod-vllm`).
#
# NAME NOTE: this is NOT the `prod` gpu-mode. That mode is the podcast_scraper
# pipeline (no vLLM at all — Ollama serves the pinned summary model). This is a
# real vLLM slot; its mode is `prod-vllm`. Keep the two distinct.
#
# AUTH (2026-09-13): mirrors autoresearch — EMPTY (effectively unauthenticated)
# so prod-vllm is a DROP-IN on :8003 for the current consumers, which send
# `Bearer EMPTY`. The prod consumer configs (prod VPS + dev) can't be rotated
# right now, so requiring a real key here would 401 them all. Tailnet-only, so
# this is defence-in-depth anyway. DEFERRED IMPROVEMENT: once the consumers can
# take a new key, switch `--api-key` back to a required `${VLLM_API_KEY:?…}` and
# set a real per-stack secret in the untracked .env.
#
# Default model: same pin as autoresearch — Qwen3-30B-A3B-Instruct-2507-FP4.
# Default port: 8003 (the only ACL-permitted egress out of the DGX), shared
# with the other vLLM slots; only one is ever up at a time.

services:
  vllm-prod-vllm:
    image: nvcr.io/nvidia/vllm:26.05-py3
    container_name: vllm-prod-vllm
    runtime: nvidia
    network_mode: host
    ipc: host                                # NCCL / large tensor moves
    env_file:
      - .env
    environment:
      - HF_HOME=${HF_HOME:-/opt/llm-models/huggingface}
      - VLLM_CACHE_ROOT=${VLLM_CACHE_PATH:-/opt/llm-models/vllm-cache}
    volumes:
      - ${HF_HOME:-/opt/llm-models/huggingface}:${HF_HOME:-/opt/llm-models/huggingface}
      - ${VLLM_CACHE_PATH:-/opt/llm-models/vllm-cache}:${VLLM_CACHE_PATH:-/opt/llm-models/vllm-cache}
    command:
      # NVIDIA vllm:*-py3 entrypoint requires `vllm serve <model>` as the
      # leading positional args (see autoresearch/docker-compose.yml for the
      # `--model=` gotcha). Subcommand + model name positionally.
      - vllm
      - serve
      # Same pin as autoresearch — Qwen3-30B-A3B-Instruct-2507-FP4 (NVFP4, MoE,
      # 30B total / ~3B active). Pin the revision SHA after first verified boot.
      - NVFP4/Qwen3-30B-A3B-Instruct-2507-FP4
      # - --revision=MODEL_REVISION_PLACEHOLDER
      - --host=0.0.0.0
      # API port HARDCODED to 8003 (the only port the tailnet ACL permits out of
      # the DGX). Decoupled from VLLM_PORT: vLLM's EngineCore binds VLLM_PORT+1
      # for ZMQ; set VLLM_PORT=8090 in .env so the engine lands on 8091, clear
      # of moss:8004. (Same rationale as autoresearch, validated 2026-08-16.)
      - --port=8003
      # EMPTY drop-in, matching autoresearch (see AUTH note in the header).
      # Consumers send `Bearer EMPTY`; defaults to EMPTY if .env omits it.
      # DEFERRED: tighten to `${VLLM_API_KEY:?…}` once consumers can rotate.
      - --api-key=${VLLM_API_KEY:-EMPTY}
      - --gpu-memory-utilization=${VLLM_GPU_MEM_UTIL:-0.75}
      # Context window — 64k, matching autoresearch. Model is 256k-native
      # (max_position_embeddings 262144, rope_scaling null) so 64k needs no
      # RoPE/YaRN scaling; KV cache fp8_e4m3, MoE (~3B active) ≈ 48 KB/token →
      # ~3 GiB for a 64k request. Cost is concurrency, not memory. (2026-09-13)
      - --max-model-len=65536
      # Served names IDENTICAL to autoresearch so prod-vllm is a true DROP-IN on
      # :8003 — consumers calling the HF id OR `autoresearch` both resolve, no
      # consumer config change. The stack/mode is still named prod-vllm; only the
      # on-wire model names match autoresearch, by design (identical replacement).
      - --served-model-name
      - NVFP4/Qwen3-30B-A3B-Instruct-2507-FP4
      - autoresearch
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Cold boot is dominated by checkpoint shard load + torch.compile
      # (~24 min observed on autoresearch's identical model). 30m absorbs the
      # worst case without a spurious unhealthy flag.
      start_period: 30m
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    restart: unless-stopped
